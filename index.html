<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>LTF Temporada 1</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap">
<style>
/* Layout: una columna. Banda de la liga, navegación, y debajo la vista activa.
   La página de un partido sigue el orden de MrREPLAY: cabecera, tarjeta con marcador y momentum, pestañas de detalle. */
:root{
  --bg:#03060f; --card:#0b1220; --ink:#eef2f7; --muted:#8a96a6; --line:#1c2431; --row:#111723;
  --chalk:#dfe8f3; --accent:#74acdf; --accent-ink:#04101c; --warn:#f0a35e; --sun:#dcecff; --celeste:#74acdf;
  --c1:#d8483b; --c2:#3f7be0; color-scheme:dark;
  --display:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:radial-gradient(900px 420px at 50% -120px,rgba(116,172,223,.16),transparent 70%),var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.flagbar{height:12px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;position:relative;
  background:linear-gradient(180deg,#74acdf 0 33.3%,#ffffff 33.3% 66.6%,#74acdf 66.6% 100%)}
.flagbar::after{display:none}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:14px;background:linear-gradient(100deg,#0a1320,#0d1118 60%);border:1px solid var(--line);border-bottom:2px solid var(--celeste);border-radius:12px;padding:12px 16px;color:var(--ink)}
.brand img{width:60px;height:60px;object-fit:contain;flex:none}
.brand p{margin:2px 0 0;color:var(--muted)}
.brand h1 span{color:var(--celeste)}
h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance;line-height:1.05}
h2{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px;color:var(--chalk)}
.sub{color:var(--muted);margin:4px 0 0}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
nav button{flex:none;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
nav button[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.sub2 button{font-size:15px;padding:7px 12px}
nav#subnav{border-bottom:1px solid var(--line);gap:2px}
nav#subnav button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 12px}
nav#subnav button[aria-current="page"]{background:none;color:var(--ink);border-bottom-color:var(--celeste)}
nav button:hover{color:var(--ink)}
.hero{box-shadow:0 10px 40px -20px rgba(116,172,223,.35)}
.panel{background:linear-gradient(180deg,#0f141d,var(--card))}
.mvp{border-color:rgba(116,172,223,.45)}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.final{font-size:12px;font-weight:600;border:1px solid rgba(116,172,223,.5);color:var(--sun);border-radius:999px;padding:2px 12px;white-space:nowrap}
.played{font-size:12px;color:var(--muted)}
.mvp::before{content:"";width:0}
.score span:first-child{color:var(--ink)}
.fl{width:20px;height:15px;object-fit:cover;border-radius:2px;flex:none;vertical-align:-2px;margin-right:4px}
.cmp{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.cmp:last-child{border-bottom:0}
.cmp b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.cmp b:last-of-type{text-align:right}
.cmp em{grid-column:1/-1;order:-1;text-align:center;font-style:normal;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cmp .bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.cmp .bar span{display:block;min-width:0}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--row);display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard .hd{display:flex;align-items:center;gap:8px}
.pcard .hd b{flex:1;min-width:0;overflow-wrap:anywhere}
.pcard .kvs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--muted)}
.pcard .kvs b{display:block;color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.ev{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .tm{font-family:var(--display);font-size:20px;font-weight:700;min-width:54px;font-variant-numeric:tabular-nums}
.ev .ic{width:26px;text-align:center;flex:none}
.ev .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.ev .tx span{display:block;font-size:13px;color:var(--muted)}
.role{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px solid var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
input[type=text],input[type=number],input[type=password],textarea,select{width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--warn);border-color:var(--warn)}
button:disabled{opacity:.5;cursor:default}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px dashed var(--line);border-radius:10px;padding:26px 14px;cursor:pointer}
.drop.over{border-color:var(--accent)}
.drop strong{font-family:var(--display);font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.status{margin:10px 0 0;font-size:14px;color:var(--muted)}
.status.bad{color:var(--warn)}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty strong{display:block;font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
th[data-sort]{cursor:pointer}
td{border-bottom:1px solid var(--line)}
tbody tr:nth-child(odd){background:var(--row)}
td.tm,th.tm{text-align:left}
td.tm{min-width:150px}
.cell{display:flex;align-items:center;gap:8px}
td.pts{font-family:var(--display);font-weight:700;font-size:20px}
.pos{color:var(--muted);width:28px}
.mini{width:26px;height:26px;border-radius:50%;object-fit:contain;display:inline-grid;place-items:center;flex:none;color:#fff;font-family:var(--display);font-weight:700;font-size:12px;overflow:hidden}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
/* lista de partidos */
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.mcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;
  background:linear-gradient(100deg,color-mix(in srgb,var(--c1) 30%,var(--card)) 0%,var(--card) 50%,color-mix(in srgb,var(--c2) 30%,var(--card)) 100%)}
.mcard:hover{border-color:var(--accent)}
.mcard .ttl{font-family:var(--display);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.03em;text-align:center;overflow-wrap:anywhere}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.mrow .s{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;font-weight:600;font-size:13px;overflow-wrap:anywhere}
.mrow .s .logo{width:46px;height:46px;font-size:18px}
.mrow .sc{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.mfoot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
/* página del partido */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;margin-bottom:6px}
.metaline{color:var(--muted);font-size:13px;margin:4px 0 0}
.hero{border-radius:14px;border:1px solid var(--line);overflow:hidden;
  background:linear-gradient(100deg,color-mix(in srgb,var(--c1) 34%,var(--card)) 0%,var(--card) 48%,var(--card) 52%,color-mix(in srgb,var(--c2) 34%,var(--card)) 100%)}
.hero header{padding:14px 16px 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.hero .t{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.mvp{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;color:var(--muted)}
.mvp b{color:var(--ink)}
.scoreline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px 12px 4px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;text-align:center}
.logo{width:88px;height:88px;border-radius:50%;object-fit:contain;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:32px;color:#fff;overflow:hidden}
.logo.crest{width:151px;height:108px;border-radius:0;overflow:visible;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.side .nm{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.03em;line-height:1.05;overflow-wrap:anywhere}
.score{font-family:var(--display);font-weight:700;font-size:68px;line-height:1;font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center}
.score i{font-style:normal;color:var(--muted);font-weight:600}
.scorers{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 16px 12px;font-size:14px}
.scorers ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;min-width:0}
.scorers li{overflow-wrap:anywhere}
.scorers .r{text-align:right}
time{color:var(--muted);font-variant-numeric:tabular-nums}
.chartbox{padding:0 14px 8px}
.chartbox h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:600}
svg.mom{display:block;width:100%;height:auto}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
.pill{display:inline-grid;place-items:center;min-width:38px;padding:1px 8px;border-radius:6px;font-family:var(--display);font-weight:700;font-size:17px;color:#fff;font-variant-numeric:tabular-nums}
.r-top{background:#2563eb}.r-hi{background:#4d9a1f}.r-mid{background:#c99a10;color:#1b1500}.r-lo{background:#d9701a}.r-low{background:#d4521e}.r-bad{background:#bd3328}.r-na{background:var(--line);color:var(--muted)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);min-width:0}
.pr:last-child{border-bottom:0}
.pr .n{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.pr .st{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted);white-space:nowrap}
.posbar{display:flex;height:28px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.posbar span{display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.6);min-width:0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--row)}
.kv b{display:block;font-family:var(--display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.grow{flex:1}
.gl{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.gl:last-child{border-bottom:0}
.gl .tm{font-family:var(--display);font-size:20px;font-weight:700;min-width:54px;font-variant-numeric:tabular-nums}
.gl .who{flex:1;min-width:0}
.gl .who b{display:block;overflow-wrap:anywhere}
.gl .who span{font-size:13px;color:var(--muted)}
.gl .sc{font-family:var(--display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#vbox .vch,#vbox.fs .vch,#vbox.fs.idle .vch,#vbox.fs.hb .vch{left:auto;right:14px;top:46px;bottom:auto;max-width:min(260px,30%);align-items:flex-end;gap:2px;font-size:12px}
#vbox .vch p{background:none;padding:0;border-radius:0;text-align:right;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6)}
#vbox .vch p b{color:var(--celeste);margin-right:4px}
#vbox.fs .vch{font-size:14px}
details.panel summary{cursor:pointer;font-weight:600}
.chatl{display:flex;flex-direction:column;gap:3px;max-height:460px;overflow:auto;font-size:14px}
.chatl p{margin:0;overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
canvas.field{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:var(--row)}
.vctl{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.vctl .grow{min-width:140px}.vctl select{width:auto}.vctl input[type=range]{width:100%}
.share{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.share .grow{min-width:220px}
.banner{border:1px solid var(--accent);border-radius:10px;padding:12px 14px;background:var(--row)}
.banner p{margin:0 0 8px}
/* formularios */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.row{display:flex;gap:8px;align-items:end}.row>*{min-width:0}.row .grow{flex:1}
input[type=color]{width:46px;height:38px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.logobtn{display:flex;align-items:center;gap:10px}
.logobtn img,.logobtn .ph{width:40px;height:40px;border-radius:50%;object-fit:contain;background:var(--bg);border:1px solid var(--line)}
.logobtn label.btn{margin:0;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
.trow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
@media (max-width:640px){
  .grid2,.grid3,.cols2{grid-template-columns:1fr}
  .logo{width:64px;height:64px;font-size:24px}.logo.crest{width:112px;height:80px}.score{font-size:50px}.side .nm{font-size:18px}.hide-s{display:none}
  .scorers{padding:4px 12px 12px;font-size:13px}.hero .t{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* estilo celeste y blanco */
/* Fondo: poné una imagen llamada fondo.jpg junto a index.html. Si no existe, queda el fondo oscuro de siempre. */
body{background:radial-gradient(900px 420px at 50% -140px,rgba(116,172,223,.22),transparent 70%),linear-gradient(rgba(3,6,15,.72),rgba(3,6,15,.9)),url("fondo.jpg") center/cover fixed,var(--bg)}
.btn{text-decoration:none;display:inline-block}
a.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
a.btn.ghost{border-color:#fff;color:#fff;background:transparent}
button.primary,a.btn.primary{box-shadow:0 6px 18px -8px rgba(116,172,223,.9)}
h1.big{font-size:46px;line-height:1;text-align:center;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h1.big span{color:var(--celeste)}
.landing,.steps{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:26px 0 6px}
.landing .sub,.steps .sub{max-width:560px}
.pill2{border:1px solid var(--sun);color:var(--sun);border-radius:999px;font-size:12px;font-weight:600;padding:3px 12px;letter-spacing:.08em;text-transform:uppercase}
.cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.formcard{max-width:520px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.chip{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--celeste);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;overflow-wrap:anywhere}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:40%;background:var(--celeste);animation:pg 1.1s ease-in-out infinite alternate}
@keyframes pg{from{margin-left:0}to{margin-left:60%}}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
#vbox:fullscreen{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:0;background:var(--bg)}
#vbox:-webkit-full-screen{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:0;background:var(--bg)}
#vbox:fullscreen h2,#vbox:-webkit-full-screen h2{display:none}
#vbox:fullscreen .stage,#vbox:-webkit-full-screen .stage{flex:1;aspect-ratio:auto;min-height:0}
.sb{position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(8,16,28,.88);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:6px 16px;font-family:var(--display);font-weight:700;font-size:22px;white-space:nowrap;max-width:94%;z-index:2}
.sb i{width:16px;height:16px;border-radius:3px;display:inline-block;flex:none;border:1px solid rgba(255,255,255,.55)}
.sb em{font-style:normal;color:var(--muted)}
.sb .tn{font-size:14px;font-weight:600;color:var(--muted);max-width:110px;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.04em}
.sb time{margin-left:10px;color:var(--ink);font-variant-numeric:tabular-nums}
.vbar{display:flex;align-items:center;gap:8px;background:#0a121d;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.vbar button{padding:6px 10px;min-width:36px}
.spd{display:flex;align-items:center;gap:4px}.spd b{min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.vbar .vt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:78px;text-align:center}
.pbar{position:relative;flex:1;min-width:80px;height:30px}
.pbar input{position:absolute;inset:0;width:100%;height:100%;margin:0;background:none;accent-color:var(--celeste)}
.marks{position:absolute;left:0;right:0;top:0;height:100%;pointer-events:none}

/* ===== Rediseño estilo MrREPLAY: barra superior, portada, funciones, login ===== */
:root{--mu:0px;--head:"Syne","Outfit",system-ui,sans-serif;--body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding-left:0;padding-right:0}
.flagbar{margin:0;height:6px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2{font-family:var(--head);font-weight:700;font-size:20px;letter-spacing:0;text-transform:none}
nav#nav{position:static;padding:0}
nav#nav:empty{display:none}
nav button{font-family:var(--body);font-weight:600;font-size:14px;letter-spacing:0;text-transform:none;border-radius:999px;padding:7px 14px}
nav.sub2 button{font-size:13px;padding:6px 12px}
nav#subnav button{border-radius:0}
.tb{position:sticky;top:var(--mu);z-index:50;background:rgba(3,6,15,.8);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tb-in{max-width:920px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-left,0px))}
.tb-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);justify-self:start}
.tb-brand img{width:38px;height:38px;object-fit:contain}
.tb-brand b{display:block;font-family:var(--head);font-weight:800;font-size:19px;line-height:1;letter-spacing:.01em}
.tb-brand small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.tb-links{display:flex;gap:2px;justify-self:center}
.tb-links a{padding:8px 14px;border-radius:999px;color:var(--muted);font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap;border:1px solid transparent}
.tb-links a:hover{color:var(--ink)}
.tb-links a[aria-current="page"]{color:var(--ink);background:rgba(116,172,223,.12);border-color:rgba(116,172,223,.55)}
.tb-auth{display:flex;align-items:center;justify-content:flex-end;gap:8px;justify-self:end}

.tb-role{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sun);border:1px solid rgba(116,172,223,.5);border-radius:999px;padding:2px 10px}

<script src="config.js"></script>
<script>
(function(){
"use strict";
var LEAGUE="LTF · Temporada 1";
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var initials=function(n){return (String(n).trim().split(/\s+/).slice(0,2).map(function(w){return w[0]||""}).join("")||"?").toUpperCase()};
var fmt=function(t){var s=Math.max(0,Math.floor(t));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
var fmtMs=function(t){var ms=Math.max(0,Math.round(t*1000)),m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+String(ms%1000).padStart(3,"0")};
function rgba(hex,a){var h=String(hex).replace("#","");if(h.length!==6)return "rgba(120,140,130,"+a+")";return "rgba("+parseInt(h.slice(0,2),16)+","+parseInt(h.slice(2,4),16)+","+parseInt(h.slice(4,6),16)+","+a+")"}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"#888"}

/* =====================================================================
   Estado
   ===================================================================== */
var MTABS=[["partidos","Replays"],["tabla","Tabla"],["fixture","Fixture"],["jugadores","Jugadores"]];
var MODES=["x5","x7"];
var DISCORD_URL="https://discord.gg/BT5DZNH2Te"; /* pegá acá el link de invitación del Discord (o ponelo en config.js como discord:"https://...") */
var SUBS=[["rep","Ver partido"],["par","Resumen"],["jug","Jugadores"],["gol","Goles"],["cal","Mapas de calor"]];
function blankUp(){return {title:"",round:"",t1:"",t2:"",status:"",bad:false,busy:false,M:null,buf:null}}
var S={user:null,modal:false,authMsg:"",teams:[],matches:[],role:"",code:"",canWrite:false,isAdmin:false,loaded:false,err:"",tab:"home",mode:"x5",roster:[],tm:null,R:{},rmsg:"",part:0,ssel:-1,
  cur:null,curMsg:"",mtab:"rep",sort:{k:"r",d:-1},pf:0,jf:0,jt:"gol",pr:0,sf:0,heat:"t1",up:blankUp(),E:{id:"",name:"",color:"#2f66c9",logo:""},
  armed:"",banner:"",sig:"",busyTeam:false,fx:null,av:null,H:{a:"",b:""},FX:{round:"",stage:"",t1:"",t2:""},GEN:{a:"",b:"",sc:6},CP:{a:"",b:""},FD:{},FP:{},fmsg:"",vp:undefined,vg:undefined,AV:{title:"",body:""}};
var CM=null; // partido que se está dibujando ahora (vista previa o guardado)

/* =====================================================================
   Datos derivados (equipos, tabla, goleadores)
   ===================================================================== */
function teamById(id){for(var i=0;i<S.teams.length;i++)if(S.teams[i].id===id)return S.teams[i];return null}
function sideTeam(m,side){
  var t=teamById(side===1?m.t1:m.t2);if(t)return t;
  return {id:"",name:(side===1?m.n1:m.n2)||(side===1?"Rojo":"Azul"),color:side===1?"#d8483b":"#3f7be0",logo:""};
}
function mOf(m){return m&&m.mode==="x7"?"x7":"x5"}
function isOff(m){return !!(m&&m.t1&&m.t2)} /* oficial = los dos equipos de la liga; si no, es un replay ajeno y no suma stats */
function modeMatches(md){return S.matches.filter(function(m){return mOf(m)===md})}
function modeTeams(md){
  if(!S.tm)return S.teams;
  var ids={};
  S.tm.forEach(function(r){if(r.mode===md)ids[r.team_id]=1});
  modeMatches(md).forEach(function(m){if(m.t1)ids[m.t1]=1;if(m.t2)ids[m.t2]=1});
  return S.teams.filter(function(t){return ids[t.id]});
}
function standings(md){
  var T={};modeTeams(md).forEach(function(t){T[t.id]={t:t,pj:0,g:0,e:0,p:0,gf:0,gc:0,form:[]}});
  modeMatches(md).forEach(function(m){
    var A=T[m.t1],B=T[m.t2];if(!A||!B)return;
    A.pj++;B.pj++;A.gf+=m.s1;A.gc+=m.s2;B.gf+=m.s2;B.gc+=m.s1;var ra=m.s1>m.s2?"g":m.s1<m.s2?"p":"e",rb=ra==="g"?"p":ra==="p"?"g":"e";if(A.form.length<5)A.form.push(ra);if(B.form.length<5)B.form.push(rb);
    if(m.s1>m.s2){A.g++;B.p++}else if(m.s1<m.s2){B.g++;A.p++}else{A.e++;B.e++}
  });
  var r=Object.keys(T).map(function(k){var x=T[k];x.pts=x.g*3+x.e;x.dg=x.gf-x.gc;x.pct=x.pj?Math.round(x.pts/(x.pj*3)*100):0;return x});
  r.sort(function(a,b){return b.pts-a.pts||b.dg-a.dg||b.gf-a.gf||a.t.name.localeCompare(b.t.name)});
  return r;
}
function scorerName(l){var m=String(l).match(/^(.*?)\s+\d+:\d{2}$/);return (m?m[1]:String(l)).trim()}
function scorers(md){
  var M={};
  modeMatches(md).filter(isOff).forEach(function(m){
    [[m.g1,m.t1,m.n1],[m.g2,m.t2,m.n2]].forEach(function(p){
      (p[0]||[]).forEach(function(l){
        if(/\(AG\)/i.test(l))return;
        var n=scorerName(l);if(!n)return;var k=n.toLowerCase();
        if(!M[k])M[k]={name:n,n:0,tid:p[1],tn:p[2]};
        M[k].n++;M[k].tid=p[1];M[k].tn=p[2];
      });
    });
  });
  return Object.keys(M).map(function(k){return M[k]}).sort(function(a,b){return b.n-a.n||a.name.localeCompare(b.name)});
}

/* =====================================================================
   Piezas visuales
   ===================================================================== */
function mini(t){return t.logo?'<img class="mini" alt="" src="'+esc(t.logo)+'">':'<span class="mini" style="background:'+esc(t.color)+'">'+esc(initials(t.name))+'</span>'}
function bigLogo(t){return t.logo?'<img class="logo" alt="Escudo de '+esc(t.name)+'" src="'+esc(t.logo)+'">':'<div class="logo" style="background:'+esc(t.color)+'">'+esc(initials(t.name))+'</div>'}
function empty(t,s){return '<div class="panel empty"><strong>'+esc(t)+'</strong>'+esc(s)+'</div>'}
function rc(r){return r==null?"r-na":r>=7.5?"r-top":r>=7?"r-hi":r>=6.5?"r-mid":r>=6?"r-lo":r>=5.5?"r-low":"r-bad"}
function pill(r){return '<span class="pill '+rc(r)+'">'+(r==null?"–":r.toFixed(1))+'</span>'}
function dateStr(v){var d=new Date(v);return isNaN(d)?"":d.toLocaleDateString("es-AR",{day:"numeric",month:"short",year:"numeric"})}
function shareUrl(id){return location.origin+location.pathname+"#partido-"+id}

/* =====================================================================
   Análisis del replay (corre en el navegador)
   ===================================================================== */
function pos(d){if(!d)return null;var p=d.pos||d.a||d;var x=p.x,y=p.y;return (typeof x==="number"&&typeof y==="number")?[x,y]:null}
function teamOf(p){var t=p&&p.team;return t&&typeof t==="object"?t.id:t}
function playersOf(st){var a=st.players,o=[];if(Array.isArray(a))return a;if(a&&typeof a.forEach==="function")a.forEach(function(p){o.push(p)});return o}
function hexc(c,def){
  if(c==null)return def;
  if(typeof c==="string"){if(/^transparent$/i.test(c))return null;var h=c.replace(/^#|^0x/i,"");return /^[0-9a-f]{6}$/i.test(h)?"#"+h:def}
  if(typeof c==="number")return "#"+("000000"+c.toString(16)).slice(-6);
  if(Array.isArray(c)&&c.length>=3)return "rgb("+c[0]+","+c[1]+","+c[2]+")";
  return def;
}
function extractMap(A,reader){
  try{
    var st=reader.state,stad=st&&(st.stadium||(st.gameState&&st.gameState.stadium));
    if(!stad)return null;
    var ex=(A.Utils&&A.Utils.exportStadium)||A.exportStadium||(reader.exportStadium&&reader.exportStadium.bind(reader));
    var o=null;
    if(typeof ex==="function"){var txt=ex(stad);o=typeof txt==="string"?((window.JSON5&&window.JSON5.parse)?window.JSON5.parse(txt):JSON.parse(txt)):txt}
    if(!o&&typeof stad.toJSON==="function")o=stad.toJSON();
    if(!o||!o.vertexes)return null;
    var tr=o.traits||{};
    var tv=function(x,k){return x&&x[k]!==undefined?x[k]:(x&&x.trait&&tr[x.trait]?tr[x.trait][k]:undefined)};
    var vs=o.vertexes.map(function(v){return [+v.x||0,+v.y||0]});
    var segs=(o.segments||[]).map(function(g){
      if(tv(g,"vis")===false)return null;
      var col=hexc(tv(g,"color"),"#e8efe9");if(!col)return null;
      var a=vs[g.v0],b=vs[g.v1];if(!a||!b)return null;
      return {a:a,b:b,c:+tv(g,"curve")||0,col:col};
    }).filter(Boolean);
    var goals=(o.goals||[]).filter(function(g){return g.p0&&g.p1}).map(function(g){return {p0:g.p0,p1:g.p1,t:g.team==="blue"?2:1}});
    var discs=(o.discs||[]).map(function(d){
      var col=hexc(tv(d,"color"),"#ffcc00"),r=tv(d,"radius");if(r===undefined)r=10;
      if(!col||!d.pos||!(+r>0))return null;
      return {x:+d.pos[0]||0,y:+d.pos[1]||0,r:+r,col:col};
    }).filter(Boolean);
    var bg=o.bg||{},w=+bg.width||0,h=+bg.height||0,bx=w,by=h;
    vs.forEach(function(v){bx=Math.max(bx,Math.abs(v[0]));by=Math.max(by,Math.abs(v[1]))});
    if(!bx||!by)return null;
    var bp=o.ballPhysics,pp=o.playerPhysics;
    var btype=bg.type||"grass",field=btype==="hockey"?"#5d636b":(hexc(bg.color,"#718c5a")||"#718c5a");
    return {w:w,h:h,bx:bx+30,by:by+30,kor:+bg.kickOffRadius||0,type:btype,grass:field,
      segs:segs,goals:goals,discs:discs,br:(bp&&+bp.radius)||10,pr:(pp&&+pp.radius)||15};
  }catch(e){return null}
}

/* Convierte lo que se vio durante la lectura en el resumen del partido. Es una función pura. */
function buildAnalysis(R){
  var frames=R.frames,map=R.map,dur=frames.length?frames[frames.length-1].t:R.ticks/60,bx=0,by=0,GW=40,GH=20;

var API=null;

function analyze(buf){

  pairs.forEach(function(p,j){t[j]=p[0];t[n0-1-j]=p[1];used[p[0]]=1;used[p[1]]=1});
  ids.forEach(function(x){if(!used[x])rest.push(x)});

  var same=arr.every(function(f){return f.kickoff&&new Date(f.kickoff).getTime()===new Date(w).getTime()});
  var h='<div class="stack" style="margin:0 0 10px">'+(w?'<p class="note" style="margin:0">'+(same?'📅 '+esc(fmtWhen(w)):'📅 Cada partido tiene su horario')+'</p>':"");
  if(w)h+='<div><button type="button" data-act="ics"'+at+'>Agregar al calendario</button></div>';
  if(S.isAdmin){
    h+='<div class="grid2">'+dtInput(key,w,"Día y hora para toda la fecha")+'<button type="button" data-act="savefxd"'+at+' data-k="'+esc(key)+'" title="Pone el mismo día y hora a todos los partidos de esta fecha">Misma hora para todos</button></div>'+
      '<div><button type="button" data-act="avisofx"'+at+'>Avisar el fixture en Discord</button></div>';
  }
  return h+'</div>';
}
function saveFxDate(round,stage){
  var key=stage?"s:"+stage:"r:"+round,v=S.FD[key],list=(S.fx||[]).filter(function(f){return (f.mode||"x5")===S.mode&&(stage?f.stage===stage:(!f.stage&&+f.round===round))});
  if(v==null)v=fxWhen(list)?toLocalInput(fxWhen(list)):"";
  var er=dtCheck(v);if(er){S.fmsg=er;render();return}
  S.fmsg="Guardando…";render();
  api.rpc("set_fixture_date",{code:S.code,p_mode:S.mode,p_round:round||null,p_stage:stage||null,p_when:v?new Date(v).toISOString():null})
    .then(function(){S.fmsg="Día y hora puestos en todos los partidos de la fecha.";delete S.FD[key];delete S.FP[key];return loadAll(true)}).then(render)
    .catch(function(e){S.fmsg="No se pudo guardar ("+((e&&e.message)||"error")+"). ¿Corriste fechas.sql en Supabase?";render()});
}
function avisoFx(round,stage){
  S.fmsg="Enviando a Discord…";render();
  fetch(CFG.url+"/functions/v1/fixture-aviso",{method:"POST",headers:api.h(),body:JSON.stringify({code:S.code,mode:S.mode,round:round||null,stage:stage||null})})
    .then(function(r){return r.json().catch(function(){return {}}).then(function(j){if(!r.ok)throw new Error(j.error||("error "+r.status));return j})})
    .then(function(){S.fmsg="Aviso enviado a Discord.";render()})
    .catch(function(e){S.fmsg="No se pudo avisar ("+((e&&e.message)||"error")+"). ¿Subiste la función fixture-aviso?";render()});
}
function icsDate(d){return new Date(d).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"")}
function icsEsc(t){return String(t).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n")}
function makeIcs(md,round,stage){
  var list=(S.fx||[]).filter(function(f){return (f.mode||"x5")===md&&f.kickoff&&(round||stage?(stage?f.stage===stage:(!f.stage&&+f.round===round)):true)});
  if(!list.length){S.fmsg="Todavía no hay día y hora cargados.";render();return}
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//LTF//Fixture//ES","CALSCALE:GREGORIAN","X-WR-CALNAME:LTF "+md];
  list.forEach(function(f){
    var a=fxTeam(f.t1),b=fxTeam(f.t2),st=new Date(f.kickoff),en=new Date(st.getTime()+3600000);
    L.push("BEGIN:VEVENT","UID:"+f.id+"@ltf","DTSTAMP:"+icsDate(new Date()),"DTSTART:"+icsDate(st),"DTEND:"+icsDate(en),
      "SUMMARY:"+icsEsc(a.name+" vs "+b.name),"DESCRIPTION:"+icsEsc("LTF "+md+" · "+(f.stage||("Fecha "+f.round))),"END:VEVENT");
  });
  L.push("END:VCALENDAR");
  var blob=new Blob([L.join("\r\n")],{type:"text/calendar;charset=utf-8"}),u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u;a.download="ltf-"+md+(round?"-fecha"+round:"")+".ics";document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove();URL.revokeObjectURL(u)},2000);
}

  S.rmsg="";
  api.rpc("save_fixture",{code:S.code,p_mode:S.mode,p_round:+X.round||null,p_stage:X.stage||null,p_t1:String(X.t1),p_t2:String(X.t2)}).then(function(){S.FX.t1="";S.FX.t2="";return loadAll(true)}).catch(failN);
}

function vFiguras(){
  var ms=modeMatches(S.mode).filter(isOff).filter(function(m){return +m.round>0});
  if(!ms.length)return empty("Todavía no hay fechas","Las figuras salen de los partidos oficiales que se subieron con número de fecha.");
  var rs=[];ms.forEach(function(m){if(rs.indexOf(+m.round)<0)rs.push(+m.round)});rs.sort(function(a,b){return b-a});
  var cur=rs.indexOf(+S.fr)>=0?+S.fr:rs[0];
  var chips='<div class="pfbar">'+rs.map(function(r){return '<button type="button" class="pfchip'+(r===cur?" on":"")+'" data-act="fround" data-v="'+r+'">Fecha '+r+'</button>'}).join("")+'</div>';
  var best={},full=false;
  ms.filter(function(m){return +m.round===cur}).forEach(function(m){
    var pl=plOf(m);
    if(pl){pl.forEach(function(p){
      if(p.r==null)return;full=true;var k=String(p.n).toLowerCase();
      var x={n:p.n,r:p.r,g:p.g||0,a:p.a||0,t:matchTeam(m,p.tm),mid:m.id};
      if(!best[k]||x.r>best[k].r||(x.r===best[k].r&&x.g+x.a>best[k].g+best[k].a))best[k]=x;
    })}else if(m.meta&&m.meta.mvp&&m.meta.mvp.n){
      var v=m.meta.mvp,k2=String(v.n).toLowerCase();
      if(!best[k2])best[k2]={n:v.n,r:v.r==null?0:v.r,g:0,a:0,t:matchTeam(m,v.tm),mid:m.id,mvp:true};
    }
  });
  var list=Object.keys(best).map(function(k){return best[k]}).sort(function(a,b){return b.r-a.r||(b.g+b.a)-(a.g+a.a)});
  if(!list.length)return chips+empty("Sin datos en la fecha "+cur,"Los partidos de esta fecha se subieron antes de que se guardaran los ratings. Con los nuevos replays van a aparecer.");
  var top=list[0],N=S.mode==="x7"?7:5,team=list.slice(0,N);
  var h=chips+'<div class="panel fig-top"><h2>Jugador de la fecha '+cur+'</h2><div class="figrow"><span class="cell">'+mini(top.t)+'<span><b class="figname">'+pLink(top.n)+'</b><br><small>'+esc(top.t.name)+'</small></span></span><span class="figr">'+pill(top.r)+'</span></div>'+
    '<p class="note" style="margin:8px 0 0">'+(top.mvp?'MVP del partido':top.g+' gol'+(top.g===1?"":"es")+' · '+top.a+' asistencia'+(top.a===1?"":"s"))+' · <a href="#partido-'+top.mid+'">ver replay</a></p></div>';
  h+='<div class="panel"><h2>Equipo de la fecha '+cur+'</h2>'+(full?"":'<p class="note" style="margin:0 0 8px">Hay partidos de esta fecha sin ratings guardados; se muestran los MVP disponibles.</p>')+'<div class="scroll"><table><thead><tr><th>#</th><th class="tm">Jugador</th><th class="tm">Equipo</th><th>Rating</th></tr></thead><tbody>';
  team.forEach(function(x,i){h+='<tr><td class="pos">'+(i+1)+'</td><td class="tm">'+pLink(x.n)+'</td><td class="tm"><span class="cell figteam">'+mini(x.t)+'<span>'+esc(x.t.name)+'</span></span></td><td class="pts">'+pill(x.r)+'</td></tr>'});
  return h+'</tbody></table></div></div>';
}
function vJugador(){
  var name=S.pname||"",key=name.toLowerCase(),rows=[],goals=0,ast=0,rs=[],team=null;
  modeMatches(S.mode).filter(isOff).forEach(function(m){
    var me=null,gc=0;
    (plOf(m)||[]).forEach(function(p){if(String(p.n).toLowerCase()===key)me=p});
    [[m.g1,1],[m.g2,2]].forEach(function(x){(x[0]||[]).forEach(function(l){
      if(/\(AG\)/i.test(l))return;
      if(scorerName(l).toLowerCase()===key){gc++;if(!me)team=matchTeam(m,x[1])}
    })});
    if(!me&&!gc)return;
    if(me){team=matchTeam(m,me.tm);ast+=me.a||0;if(me.r!=null)rs.push(me.r)}
    goals+=gc;
    rows.push({m:m,g:gc,a:me?(me.a||0):null,r:me?me.r:null});
  });
  if(!rows.length)return empty("No encontré a "+(name||"ese jugador"),"Todavía no tiene goles ni partidos oficiales guardados en "+S.mode+".");
  var avg=rs.length?rs.reduce(function(a,b){return a+b},0)/rs.length:null,bestR=rs.length?Math.max.apply(null,rs):null;
  var st=function(l,v){return '<div class="pst"><b>'+v+'</b><span>'+l+'</span></div>'};
  var h='<div class="panel"><div class="figrow"><span class="cell">'+(team?mini(team):"")+'<span><b class="figname">'+esc(name)+'</b><br><small>'+(team?tlink(team):"")+' · '+S.mode+'</small></span></span></div>'+
    '<div class="pstats">'+st("Partidos",rows.length)+st("Goles",goals)+(rs.length?st("Asistencias",ast)+st("Rating prom.",avg.toFixed(1))+st("Mejor rating",bestR.toFixed(1)):"")+'</div>'+
    (rs.length?"":'<p class="note" style="margin:10px 0 0">Los ratings y asistencias se guardan desde los replays nuevos; por ahora solo se cuentan los goles.</p>')+'</div>';
  h+='<div class="panel"><h2>Sus partidos</h2><div class="scroll"><table><thead><tr><th class="tm">Partido</th><th>Goles</th><th>Rating</th></tr></thead><tbody>';
  rows.forEach(function(x){var m=x.m;h+='<tr><td class="tm"><a href="#partido-'+m.id+'">'+esc(m.title||(sideTeam(m,1).name+" vs "+sideTeam(m,2).name))+'</a><br><small>'+m.s1+'–'+m.s2+(m.round?' · Fecha '+m.round:"")+'</small></td><td class="pts">'+x.g+'</td><td class="pts">'+(x.r==null?"–":pill(x.r))+'</td></tr>'});
  return h+'</tbody></table></div></div>';
}

function namesOf(A){var o={};(A&&A.players||[]).forEach(function(p){o[p.id]=p.n});return o}
function goalStrings(A,tm){return A.goals.filter(function(g){return g.tm===tm}).map(function(g){return g.n+(g.og?" (AG)":"")+" "+fmt(g.t)})}
function scorerList(M,tm){
  var A=M.A,html="";
  if(A){
    var order=[],by={};
    A.goals.filter(function(g){return g.tm===tm}).forEach(function(g){
      var k=g.n+(g.og?"|ag":"");if(!by[k]){by[k]={n:g.n,og:g.og,t:[]};order.push(k)}by[k].t.push(fmt(g.t));
    });
    order.forEach(function(k){var x=by[k];html+='<li>'+esc(x.n)+(x.og?' <span class="badge">AG</span>':"")+' <time>'+x.t.join(", ")+'</time></li>'});
  }else{
    (tm===1?M.g1:M.g2||[]).forEach(function(l){var m=String(l).match(/^(.*?)\s+(\d+:\d{2})$/);html+='<li>'+(m?esc(m[1])+' <time>'+esc(m[2])+'</time>':esc(l))+'</li>'});
  }
  return html;
}
function momentumHTML(M){
  var A=M.A;if(!A||!A.mom||A.mom.length<2)return "";
  var W=760,H=130,L=14,R=14,mid=58,amp=50,n=A.mom.length,iw=W-L-R,dur=Math.max(A.dur,1);
  var a=sideTeam(M,1),b=sideTeam(M,2),X=function(i){return L+i/(n-1)*iw};
  var up="M"+X(0)+","+mid,dn="M"+X(0)+","+mid,i;
  for(i=0;i<n;i++){up+=" L"+X(i).toFixed(1)+","+(mid-Math.max(A.mom[i],0)*amp).toFixed(1);dn+=" L"+X(i).toFixed(1)+","+(mid+Math.max(-A.mom[i],0)*amp).toFixed(1)}
  up+=" L"+X(n-1)+","+mid+" Z";dn+=" L"+X(n-1)+","+mid+" Z";
  var s='<svg class="mom" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Dominio del partido">';
  s+='<path d="'+up+'" fill="'+esc(a.color)+'" fill-opacity=".55" stroke="'+esc(a.color)+'" stroke-width="1.5"/>';
  s+='<path d="'+dn+'" fill="'+esc(b.color)+'" fill-opacity=".55" stroke="'+esc(b.color)+'" stroke-width="1.5"/>';
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+mid+'" y2="'+mid+'" stroke="'+css("--line")+'" stroke-width="1"/>';
  var half=dur/2,hx=L+iw/2,mc=css("--muted"),tt,x;
  s+='<line x1="'+hx.toFixed(1)+'" x2="'+hx.toFixed(1)+'" y1="4" y2="'+(H-14)+'" stroke="'+css("--line")+'" stroke-width="1" stroke-dasharray="3 4"/>';
  s+='<text x="'+L+'" y="'+(H-3)+'" font-size="11" fill="'+mc+'">1.er tiempo</text><text x="'+(hx+4).toFixed(1)+'" y="'+(H-3)+'" font-size="11" fill="'+mc+'">2.º tiempo</text>';
  for(var hf=0;hf<2;hf++){
    for(tt=120;tt<half-30;tt+=120){x=L+(hf*half+tt)/dur*iw;s+='<text x="'+x.toFixed(1)+'" y="'+(H-3)+'" font-size="11" text-anchor="middle" fill="'+mc+'">'+Math.round(tt/60)+"'</text>"}
  }
  A.goals.forEach(function(g){
    var x=L+clamp(g.t/dur,0,1)*iw,col=g.tm===1?a.color:b.color;
    s+='<circle cx="'+x.toFixed(1)+'" cy="'+(H-26)+'" r="6" fill="'+(g.og?"none":"#ffffff")+'" stroke="'+esc(col)+'" stroke-width="3"/>';
  });
  return s+'</svg>';
}
function bestOf(M,tm){
  var A=M.A,b=null;if(!A||!A.players)return null;
  A.players.forEach(function(p){
    if(p.tm!==tm)return;var r=p.r==null?-1:p.r,br=b?(b.r==null?-1:b.r):-2;
    if(!b||r>br||(r===br&&p.goals+p.ast>b.goals+b.ast))b=p;
  });
  return b;
}
/* Pelotita del equipo: escudo grande atrás + pelota con la camiseta y el avatar del mejor jugador */
function crestBall(M,side){
  var t=sideTeam(M,side),A=M.A,bp=bestOf(M,side);
  if(!A)return bigLogo(t);
  var kit=(A.kit&&A.kit[side])||{a:0,t:"#ffffff",c:[t.color]},n=kit.c.length,k,id="cb"+side;
  var av=bp&&bp.av?bp.av:initials(t.name),R=31,cy=50,sw=R*2/n,SZ=92,sx=side===1?0:140-SZ,cx=side===1?100:40;

function drawShots(){
  var c=$("sc");if(!c||!CM||!CM.A||!CM.A.adv)return;
  var A=CM.A,g=c.getContext("2d"),W=c.width,H=c.height,b=A.b,s=W/(2*b[0]),k=W/960,sel=S.ssel;
  var X=function(q){return (q+b[0])*s},Y=function(q){return (q+b[1])*s};
  g.clearRect(0,0,W,H);g.fillStyle=css("--row");g.fillRect(0,0,W,H);
  if(A.map){drawMap(g,A.map,X,Y,s,false)}
  else{g.strokeStyle=css("--line");g.lineWidth=2;g.strokeRect(1,1,W-2,H-2);g.beginPath();g.moveTo(W/2,0);g.lineTo(W/2,H);g.stroke()}
  var shots=A.adv.shots,vis=function(sh){return !S.sf||sh.tm===S.sf};
  /* líneas suaves para todos; solo el remate elegido se marca fuerte */
  shots.forEach(function(sh,ix){
    if(!vis(sh)||ix===sel)return;
    var e=shotEnd(sh,A);
    g.beginPath();g.moveTo(X(sh.x),Y(sh.y));g.lineTo(X(e[0]),Y(e[1]));
    g.globalAlpha=sel>=0?.1:.22;g.strokeStyle=sideTeam(CM,sh.tm).color;g.lineWidth=Math.max(1.5,2*k);g.stroke();g.globalAlpha=1;
  });
  if(sel>=0&&shots[sel]&&vis(shots[sel])){
    var ss=shots[sel],e2=shotEnd(ss,A),sc=sideTeam(CM,ss.tm).color;
    g.save();g.lineCap="round";g.setLineDash(ss.g||ss.on?[]:[10*k,8*k]);
    g.beginPath();g.moveTo(X(ss.x),Y(ss.y));g.lineTo(X(e2[0]),Y(e2[1]));
    g.strokeStyle="rgba(255,255,255,.9)";g.lineWidth=Math.max(3,5*k);g.stroke();
    g.strokeStyle=sc;g.lineWidth=Math.max(2,3*k);g.stroke();g.restore();
    g.beginPath();g.arc(X(e2[0]),Y(e2[1]),Math.max(3,4*k),0,6.2832);g.fillStyle=sc;g.fill();g.lineWidth=1.5;g.strokeStyle="#fff";g.stroke();
  }
  shots.forEach(function(sh,ix){
    if(!vis(sh))return;
    var col=sideTeam(CM,sh.tm).color,r=Math.max(6,(6+sh.xg*22)*k),dim=sel>=0&&ix!==sel;
    g.globalAlpha=dim?.45:1;
    g.beginPath();g.arc(X(sh.x),Y(sh.y),r,0,6.2832);
    if(sh.g){g.fillStyle="#ffffff";g.fill();g.lineWidth=4*k;g.strokeStyle=col;g.stroke()}
    else if(sh.on){g.fillStyle=col;g.globalAlpha=dim?.35:.85;g.fill();g.globalAlpha=dim?.45:1;g.lineWidth=2*k;g.strokeStyle="#ffffff";g.stroke()}
    else{g.lineWidth=3*k;g.strokeStyle=col;g.stroke()}
    g.globalAlpha=1;
    if(ix===sel){g.beginPath();g.arc(X(sh.x),Y(sh.y),r+5*k,0,6.2832);g.lineWidth=2.5*k;g.strokeStyle="#ffffff";g.stroke()}
  });
}
function pickShot(e){
  var c=$("sc");if(!c||!CM||!CM.A||!CM.A.adv)return;
  var rc=c.getBoundingClientRect(),W=c.width,k=W/960,sc=W/rc.width,px=(e.clientX-rc.left)*sc,py=(e.clientY-rc.top)*sc,A=CM.A,b=A.b,s=W/(2*b[0]),best=-1,bd=1e9;
  A.adv.shots.forEach(function(sh,ix){
    if(S.sf&&sh.tm!==S.sf)return;
    var dx=(sh.x+b[0])*s-px,dy=(sh.y+b[1])*s-py,d=Math.sqrt(dx*dx+dy*dy),r=Math.max(6,(6+sh.xg*22)*k)+10*k;
    if(d<=r&&d<bd){bd=d;best=ix}
  });
  S.ssel=best===S.ssel?-1:best;
  var det=$("sdet");if(det)det.innerHTML=shotDetailHTML(CM);
  drawShots();
}

function runAnalysis(){

  up.busy=true;up.bad=false;up.status="Analizando replay… puede tardar unos segundos.";render();
  analyze(up.buf).then(function(res){
    var A=res.A;if(!A.players.length&&!A.goals.length)throw new Error("no encontré jugadores ni goles en el archivo");
    up.M={id:"",title:up.title,round:up.round,t1:up.t1,t2:up.t2,n1:"",n2:"",s1:A.s1,s2:A.s2,g1:[],g2:[],A:A,frames:res.frames,saved:false,created_at:Date.now()};

function openMatch(id){
  var m=S.matches.filter(function(x){return x.id===id})[0];
  if(!m){S.cur=null;S.curMsg="No encontré ese partido";render();return}
  var M=Object.assign({},m,{saved:true,A:null,frames:null,rstate:""});
  S.mode=mOf(m);S.cur=M;S.curMsg="";V.t=0;V.playing=false;S.part=0;S.ssel=-1;S.sf=0;RP.pend=0;render();
  api.get("matches?id=eq."+encodeURIComponent(id)+"&select=stats").then(function(r){
    var st=r[0]&&r[0].stats;M.A=st&&typeof st==="object"?st:{v:1};
    if(S.cur===M){render();if(S.mtab==="rep")loadReplay(M)}
  }).catch(function(){M.A={v:1};if(S.cur===M)render()});
}
function loadReplay(M){
  if(M.rbuf||M.rstate||!M.has_replay||!M.A||M.A.v!==2)return;
  M.rstate="loading";render();
  api.get("matches?id=eq."+encodeURIComponent(M.id)+"&select=replay").then(function(r){
    var b=r[0]&&r[0].replay;if(!b)throw new Error("sin replay");
    return b64dec(b);
  }).then(function(buf){M.rbuf=buf;M.rstate="ok"})
  .catch(function(){M.rstate="err"}).then(function(){if(S.cur===M)render()});
}
function parseHash(h){
  var m=h.match(/^partido-([0-9a-f-]{36})$/i);if(m)return {tab:"partido",id:m[1]};
  m=h.match(/^(x5|x7)-equipo-(.+)$/);if(m){var tid="";try{tid=decodeURIComponent(m[2])}catch(e){tid=m[2]}return {tab:"equipo",mode:m[1],teamId:tid}}
  m=h.match(/^(x5|x7)-jugador-(.+)$/);if(m){var pn="";try{pn=decodeURIComponent(m[2])}catch(e){pn=m[2]}return {tab:"jugador",mode:m[1],pname:pn}}
  m=h.match(/^(x5|x7)(?:-(subir|partidos|tabla|fixture|jugadores|goleadores|figuras|plantillas|comparar|h2h|votar|inicio))?$/);
  if(m){
    var k=m[2]||"tabla";
    /* links viejos: goleadores y figuras ahora son una sola pestaña; cara a cara, votar e inicio ya no existen */
    if(k==="goleadores")return {tab:"jugadores",mode:m[1],jt:"gol"};
    if(k==="figuras")return {tab:"jugadores",mode:m[1],jt:"fig"};
    if(k==="comparar")return {tab:"jugadores",mode:m[1],jt:"cmp"};
    if(k==="h2h"||k==="votar"||k==="inicio")k="tabla";
    return {tab:k,mode:m[1]};
  }
  if(/^(codigo|equipos|musica)$/.test(h))return {tab:h};
  if(/^(subir|partidos|tabla)$/.test(h))return {tab:h,mode:"x5"}; /* links viejos */
  if(h==="goleadores")return {tab:"jugadores",mode:"x5",jt:"gol"};
  return {tab:"home"};
}
function route(){
  var P=parseHash(location.hash.slice(1));
  V.playing=false;killPlayer();S.rmsg="";
  if(P.mode)S.mode=P.mode;
  if(P.teamId!==undefined)S.teamId=P.teamId;
  if(P.pname!==undefined)S.pname=P.pname;
  if(P.jt)S.jt=P.jt;
  if(P.tab==="partido"){
    S.tab="partido";
    if(!S.cur||S.cur.id!==P.id){S.cur=null;if(S.loaded){openMatch(P.id);return}}
  }else{
    S.tab=P.tab;S.cur=null;if(S.tab!=="subir")S.banner="";
    /* con una playlist de Spotify puesta, se pausa la música de fondo para que no suenen las dos juntas */
    if(P.tab==="musica"&&spGet()){MU.on=false;if(MU.a&&!MU.a.paused)MU.a.pause()}
  }
  render();
}

/* Sesión con Discord a través de Supabase Auth (flujo implícito, sin librerías) */
function authStore(s){try{if(s)localStorage.setItem("ltf-sess",JSON.stringify(s));else localStorage.removeItem("ltf-sess")}catch(e){}}
function authLoad(){try{return JSON.parse(localStorage.getItem("ltf-sess")||"null")}catch(e){return null}}
function authCapture(){
  var h=location.hash.slice(1);
  if(h.indexOf("access_token=")<0&&h.indexOf("error_description=")<0)return;
  var p={};h.split("&").forEach(function(kv){var i=kv.indexOf("=");if(i>0){try{p[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1).replace(/\+/g," "))}catch(e){}}});
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){location.hash=""}
  if(p.error_description){S.authMsg=p.error_description;S.modal=true;return}
  if(p.access_token)authStore({at:p.access_token,rt:p.refresh_token||"",exp:Date.now()+(+p.expires_in||3600)*1000});
}
function authRefresh(s){
  if(!s.rt)return Promise.resolve(null);
  return fetch(CFG.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:CFG.key,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.rt})})
    .then(function(r){if(!r.ok)throw r.status;return r.json()})
    .then(function(j){var n={at:j.access_token,rt:j.refresh_token||s.rt,exp:Date.now()+(+j.expires_in||3600)*1000};authStore(n);return n})
    .catch(function(){authStore(null);return null});
}
function authInit(){
  var s=authLoad();if(!s||!s.at)return;
  (Date.now()>s.exp-30000?authRefresh(s):Promise.resolve(s)).then(function(s2){
    if(!s2)return;
    return fetch(CFG.url+"/auth/v1/user",{headers:{apikey:CFG.key,Authorization:"Bearer "+s2.at}}).then(function(r){if(!r.ok)throw r.status;return r.json()}).then(function(u){
      var m=u.user_metadata||{};
      S.user={id:u.id,name:(m.custom_claims&&m.custom_claims.global_name)||m.full_name||m.name||m.user_name||m.preferred_username||String(u.email||"").split("@")[0]||"usuario",avatar:m.avatar_url||m.picture||""};
      render();discordRole(s2.at);
    });
  }).catch(function(e){if(e===401||e===403){authStore(null);S.user=null;render()}});

/* Si tu usuario de Discord tiene el rol de admin o de capitán en el servidor, entra solo con ese rol (lo verifica la función discord-role de Supabase) */
function discordRole(at){
  if(!CFG.url)return;
  var via="";try{via=localStorage.getItem("ltf-via")||""}catch(e){}
  fetch(CFG.url+"/functions/v1/discord-role",{method:"POST",headers:{apikey:CFG.key,Authorization:"Bearer "+at,"Content-Type":"application/json"},body:"{}"})
    .then(function(r){return r.ok?r.json():null})
    .then(function(j){
      if(!j)return; /* si la función no responde, no se toca nada */
      if(j.role&&j.code){
        if(S.role&&via!=="discord")return; /* entró a mano con un código: no se le cambia el rol */
        if(S.role===j.role&&S.code===j.code)return;
        S.revoked=false;S.code=j.code;setRole(j.role);
        try{localStorage.setItem("ltf-code",j.code);localStorage.setItem("ltf-via","discord")}catch(e){}
        render();
      }else if(via==="discord"){ /* ya no tiene el rol en Discord: se le saca el acceso */
        S.revoked=true;logout();
      }
    }).catch(function(){});
}

function muInit(){
  MU.list=muList();if(!MU.list.length)return;
  MU.on=false; /* arranca apagada; se prende desde el reproductor o la pestaña Música */MU.shf=muLS("ltf-mshuf")==="1";
  var v=parseFloat(muLS("ltf-mvol"));if(v>=0&&v<=1)MU.vol=v;
  var i0=0; /* siempre arranca por la primera canción de la lista */
  var a=new Audio();a.preload="auto";a.volume=MU.vol;MU.a=a;
  var w=document.createElement("div");w.className="mu";w.hidden=true;
  w.innerHTML='<div class="musp">'+
    '<div class="mhead"><div class="mcov" data-m="cov"></div><div class="minfo"><b></b><span></span></div></div>'+
    '<input type="range" min="0" max="1000" value="0" data-m="pos" aria-label="Posición">'+
    '<div class="mtime"><span data-m="c">0:00</span><span data-m="d">0:00</span></div>'+
    '<div class="mctl"><button type="button" data-m="pl" title="Música y Spotify">'+IC.q+'</button><button type="button" data-m="sh" title="Aleatorio">'+IC.sh+'</button><button type="button" data-m="pv" title="Anterior">'+IC.pv+'</button><button type="button" class="big" data-m="pp" aria-label="Reproducir o pausar">'+IC.play+'</button><button type="button" data-m="nx" title="Siguiente">'+IC.nx+'</button>'+
    '<span class="mvol"><button type="button" data-m="vl" title="Silenciar">'+IC.vol+'</button><span class="vpop"><div><input type="range" min="0" max="100" value="'+Math.round(MU.vol*100)+'" data-m="vol" aria-label="Volumen"></div></span></span></div>'+
    '</div>';
  document.body.appendChild(w);
  var q=function(k){return w.querySelector('[data-m="'+k+'"]')},E=MU.el;
  E.w=w;E.cov=w.querySelector(".mcov");E.cov.onclick=function(){if(spGet())location.hash="musica"};E.panel=w.querySelector(".musp");E.t=w.querySelector(".minfo b");E.ar=w.querySelector(".minfo span");
  ["pos","c","d","pl","sh","pv","pp","nx","vl","vol"].forEach(function(k){E[k]=q(k)});
  E.pl.onclick=function(){location.hash="musica"};
  E.pp.onclick=function(){
    if(spGet()){if(SP.ctrl)SP.ctrl.togglePlay();else spEnsure();return}
    if(a.paused){MU.on=true;muLS("ltf-music","1");var p=a.play();if(p&&p.catch)p.catch(function(){})}
    else{MU.on=false;muLS("ltf-music","0");a.pause()}
    muUI();
  };
  E.pv.onclick=function(){if(a.currentTime>4)a.currentTime=0;else muNext(-1)};
  E.nx.onclick=function(){muNext(1)};
  E.sh.onclick=function(){MU.shf=!MU.shf;MU.q=[];MU.hist=[];muLS("ltf-mshuf",MU.shf?"1":"0");muUI()};
  E.vl.onclick=function(){a.muted=!a.muted;muUI()};
  E.vol.oninput=function(){var x=this.value/100;a.muted=false;a.volume=x;MU.vol=x;muLS("ltf-mvol",String(x));muUI()};
  E.pos.onpointerdown=function(){MU.drag=true};
  E.pos.oninput=function(){if(spGet()){if(SP.ctrl&&SP.dur)SP.ctrl.seek(this.value/1000*SP.dur/1000);return}var d=isFinite(a.duration)?a.duration:0;if(d)a.currentTime=this.value/1000*d;muTime()};
  E.pos.onchange=function(){MU.drag=false};
  a.addEventListener("timeupdate",muTime);a.addEventListener("loadedmetadata",muTime);
  a.addEventListener("play",muUI);a.addEventListener("pause",muUI);
  a.addEventListener("playing",function(){MU.fails=0});
  a.addEventListener("ended",function(){if(MU.list.length>1)muNext(1)});
  a.addEventListener("error",function(){
    MU.fails++;
    if(MU.list.length>1&&MU.fails<MU.list.length)muGo(MU.i+1,MU.on);
    else{MU.bad=true;muSync()}
  });
  muGo(i0,false);
  /* los navegadores no dejan sonar solos: arranca con el primer toque o tecla */
  var kick=function(e){if(e.target&&e.target.closest&&e.target.closest(".mu"))return;["pointerdown","keydown","touchstart"].forEach(function(n){document.removeEventListener(n,kick,true)});muSync()};
  ["pointerdown","keydown","touchstart"].forEach(function(n){document.addEventListener(n,kick,true)});
  /* si tocás play dentro del reproductor de Spotify (iframe), se pausa la música de fondo para que no suenen las dos juntas */
  window.addEventListener("blur",function(){setTimeout(function(){var f=document.activeElement;if(f&&f.tagName==="IFRAME"&&f.classList.contains("spf")&&!a.paused){MU.on=false;a.pause();muUI()}},0)});
  var r0=render;render=function(){r0.apply(this,arguments);spEnsure();spPlace();muSync()};
  window.addEventListener("resize",spPlace);setInterval(spPlace,800);
  muSync();
}
muInit();

/* =====================================================================
   Arranque
   ===================================================================== */
authCapture();
render();
if(!CFG.url||!CFG.key||/PEGAR_AQUI/.test(CFG.url+CFG.key)){
  S.err="Falta configurar la conexión. Completá el archivo config.js con la dirección y la clave de tu proyecto de Supabase.";render();return;
}
loadAll(true);
authInit();
setInterval(function(){loadAll(false)},60000);
var saved="";try{saved=localStorage.getItem("ltf-code")||""}catch(e){}
if(saved)checkCode(saved).then(function(r){if(r&&!S.revoked){S.code=saved;setRole(r);render()}else{try{localStorage.removeItem("ltf-code")}catch(e){}}}).catch(function(){});
})();
</script>
</body>
</html>
