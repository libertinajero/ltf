<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>LTF Replays</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: una columna. Banda de la liga, navegación, y debajo la vista activa.
   La página de un partido sigue el orden de MrREPLAY: cabecera, tarjeta con marcador y momentum, pestañas de detalle. */
:root{
  --bg:#03060f; --card:#0b1220; --ink:#eef2f7; --muted:#8a96a6; --line:#1c2431; --row:#111723;
  --chalk:#dfe8f3; --accent:#74acdf; --accent-ink:#04101c; --warn:#f0a35e; --sun:#f6b40e; --celeste:#74acdf;
  --c1:#d8483b; --c2:#3f7be0; color-scheme:dark;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:radial-gradient(900px 420px at 50% -120px,rgba(116,172,223,.16),transparent 70%),var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.flagbar{height:12px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;position:relative;
  background:linear-gradient(180deg,#74acdf 0 33.3%,#ffffff 33.3% 66.6%,#74acdf 66.6% 100%)}
.flagbar::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;transform:translate(-50%,-50%);border-radius:50%;background:var(--sun);box-shadow:0 0 0 2px #05070b,0 0 14px 3px rgba(246,180,14,.55)}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:14px;background:linear-gradient(100deg,#0a1320,#0d1118 60%);border:1px solid var(--line);border-bottom:2px solid var(--celeste);border-radius:12px;padding:12px 16px;color:var(--ink)}
.brand img{width:60px;height:60px;object-fit:contain;flex:none}
.brand p{margin:2px 0 0;color:var(--muted)}
.brand h1 span{color:var(--celeste)}
h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance;line-height:1.05}
h2{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px;color:var(--chalk)}
.sub{color:var(--muted);margin:4px 0 0}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
nav button{flex:none;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
nav button[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.sub2 button{font-size:15px;padding:7px 12px}
nav#subnav{border-bottom:1px solid var(--line);gap:2px}
nav#subnav button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 12px}
nav#subnav button[aria-current="page"]{background:none;color:var(--ink);border-bottom-color:var(--celeste)}
nav button:hover{color:var(--ink)}
.hero{box-shadow:0 10px 40px -20px rgba(116,172,223,.35)}
.panel{background:linear-gradient(180deg,#0f141d,var(--card))}
.mvp{border-color:rgba(246,180,14,.45)}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.final{font-size:12px;font-weight:600;border:1px solid rgba(246,180,14,.5);color:var(--sun);border-radius:999px;padding:2px 12px;white-space:nowrap}
.played{font-size:12px;color:var(--muted)}
.mvp::before{content:"";width:0}
.score span:first-child{color:var(--ink)}
.fl{width:20px;height:15px;object-fit:cover;border-radius:2px;flex:none;vertical-align:-2px;margin-right:4px}
.cmp{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.cmp:last-child{border-bottom:0}
.cmp b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.cmp b:last-of-type{text-align:right}
.cmp em{grid-column:1/-1;order:-1;text-align:center;font-style:normal;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cmp .bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.cmp .bar span{display:block;min-width:0}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--row);display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard .hd{display:flex;align-items:center;gap:8px}
.pcard .hd b{flex:1;min-width:0;overflow-wrap:anywhere}
.pcard .kvs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--muted)}
.pcard .kvs b{display:block;color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.ev{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .tm{font-family:var(--display);font-size:20px;font-weight:700;min-width:54px;font-variant-numeric:tabular-nums}
.ev .ic{width:26px;text-align:center;flex:none}
.ev .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.ev .tx span{display:block;font-size:13px;color:var(--muted)}
.role{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px solid var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
input[type=text],input[type=number],input[type=password],textarea,select{width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--warn);border-color:var(--warn)}
button:disabled{opacity:.5;cursor:default}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px dashed var(--line);border-radius:10px;padding:26px 14px;cursor:pointer}
.drop.over{border-color:var(--accent)}
.drop strong{font-family:var(--display);font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.status{margin:10px 0 0;font-size:14px;color:var(--muted)}
.status.bad{color:var(--warn)}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty strong{display:block;font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
th[data-sort]{cursor:pointer}
td{border-bottom:1px solid var(--line)}
tbody tr:nth-child(odd){background:var(--row)}
td.tm,th.tm{text-align:left}
td.tm{min-width:150px}
.cell{display:flex;align-items:center;gap:8px}
td.pts{font-family:var(--display);font-weight:700;font-size:20px}
.pos{color:var(--muted);width:28px}
.mini{width:26px;height:26px;border-radius:50%;object-fit:contain;display:inline-grid;place-items:center;flex:none;color:#fff;font-family:var(--display);font-weight:700;font-size:12px;overflow:hidden}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
/* lista de partidos */
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.mcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;
  background:linear-gradient(100deg,color-mix(in srgb,var(--c1) 30%,var(--card)) 0%,var(--card) 50%,color-mix(in srgb,var(--c2) 30%,var(--card)) 100%)}
.mcard:hover{border-color:var(--accent)}
.mcard .ttl{font-family:var(--display);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.03em;text-align:center;overflow-wrap:anywhere}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.mrow .s{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;font-weight:600;font-size:13px;overflow-wrap:anywhere}
.mrow .s .logo{width:46px;height:46px;font-size:18px}
.mrow .sc{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.mfoot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
/* página del partido */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;margin-bottom:6px}
.metaline{color:var(--muted);font-size:13px;margin:4px 0 0}
.hero{border-radius:14px;border:1px solid var(--line);overflow:hidden;
  background:linear-gradient(100deg,color-mix(in srgb,var(--c1) 34%,var(--card)) 0%,var(--card) 48%,var(--card) 52%,color-mix(in srgb,var(--c2) 34%,var(--card)) 100%)}
.hero header{padding:14px 16px 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.hero .t{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.mvp{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;color:var(--muted)}
.mvp b{color:var(--ink)}
.scoreline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px 12px 4px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;text-align:center}
.logo{width:88px;height:88px;border-radius:50%;object-fit:contain;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:32px;color:#fff;overflow:hidden}
.side .nm{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.03em;line-height:1.05;overflow-wrap:anywhere}
.score{font-family:var(--display);font-weight:700;font-size:68px;line-height:1;font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center}
.score i{font-style:normal;color:var(--muted);font-weight:600}
.scorers{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 16px 12px;font-size:14px}
.scorers ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;min-width:0}
.scorers li{overflow-wrap:anywhere}
.scorers .r{text-align:right}
time{color:var(--muted);font-variant-numeric:tabular-nums}
.chartbox{padding:0 14px 8px}
.chartbox h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:600}
svg.mom{display:block;width:100%;height:auto}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
.pill{display:inline-grid;place-items:center;min-width:38px;padding:1px 8px;border-radius:6px;font-family:var(--display);font-weight:700;font-size:17px;color:#fff;font-variant-numeric:tabular-nums}
.r-top{background:#2563eb}.r-hi{background:#4d9a1f}.r-mid{background:#c99a10;color:#1b1500}.r-lo{background:#d9701a}.r-low{background:#d4521e}.r-bad{background:#bd3328}.r-na{background:var(--line);color:var(--muted)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);min-width:0}
.pr:last-child{border-bottom:0}
.pr .n{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.pr .st{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted);white-space:nowrap}
.posbar{display:flex;height:28px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.posbar span{display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.6);min-width:0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--row)}
.kv b{display:block;font-family:var(--display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.grow{flex:1}
.gl{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.gl:last-child{border-bottom:0}
.gl .tm{font-family:var(--display);font-size:20px;font-weight:700;min-width:54px;font-variant-numeric:tabular-nums}
.gl .who{flex:1;min-width:0}
.gl .who b{display:block;overflow-wrap:anywhere}
.gl .who span{font-size:13px;color:var(--muted)}
.gl .sc{font-family:var(--display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chatl{display:flex;flex-direction:column;gap:3px;max-height:460px;overflow:auto;font-size:14px}
.chatl p{margin:0;overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
canvas.field{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:var(--row)}
.vctl{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.vctl .grow{min-width:140px}.vctl select{width:auto}.vctl input[type=range]{width:100%}
.share{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.share .grow{min-width:220px}
.banner{border:1px solid var(--accent);border-radius:10px;padding:12px 14px;background:var(--row)}
.banner p{margin:0 0 8px}
/* formularios */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.row{display:flex;gap:8px;align-items:end}.row>*{min-width:0}.row .grow{flex:1}
input[type=color]{width:46px;height:38px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.logobtn{display:flex;align-items:center;gap:10px}
.logobtn img,.logobtn .ph{width:40px;height:40px;border-radius:50%;object-fit:contain;background:var(--bg);border:1px solid var(--line)}
.logobtn label.btn{margin:0;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
.trow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
@media (max-width:640px){
  .grid2,.grid3,.cols2{grid-template-columns:1fr}
  .logo{width:64px;height:64px;font-size:24px}.score{font-size:50px}.side .nm{font-size:18px}.hide-s{display:none}
  .scorers{padding:4px 12px 12px;font-size:13px}.hero .t{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* estilo celeste y blanco */
/* Fondo: poné una imagen llamada fondo.jpg junto a index.html. Si no existe, queda el fondo oscuro de siempre. */
body{background:radial-gradient(900px 420px at 50% -140px,rgba(116,172,223,.22),transparent 70%),linear-gradient(rgba(3,6,15,.72),rgba(3,6,15,.9)),url("fondo.jpg") center/cover fixed,var(--bg)}
.btn{text-decoration:none;display:inline-block}
a.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
a.btn.ghost{border-color:#fff;color:#fff;background:transparent}
button.primary,a.btn.primary{box-shadow:0 6px 18px -8px rgba(116,172,223,.9)}
h1.big{font-size:46px;line-height:1;text-align:center;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h1.big span{color:var(--celeste)}
.landing,.steps{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:26px 0 6px}
.landing .sub,.steps .sub{max-width:560px}
.hero-ar{border:1px solid var(--line);border-radius:16px;padding:34px 18px;background:repeating-linear-gradient(90deg,rgba(116,172,223,.14) 0 64px,rgba(255,255,255,.05) 64px 128px),linear-gradient(180deg,#0b1730,#0b1220)}
.pill2{border:1px solid var(--sun);color:var(--sun);border-radius:999px;font-size:12px;font-weight:600;padding:3px 12px;letter-spacing:.08em;text-transform:uppercase}
.cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
a.tile{display:flex;flex-direction:column;gap:4px;padding:16px;border:1px solid var(--line);border-left:4px solid var(--celeste);border-radius:10px;background:var(--card);color:var(--ink);text-decoration:none}
a.tile:hover{border-color:var(--celeste)}
a.tile b{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.03em}a.tile span{color:var(--muted);font-size:13px}
.formcard{max-width:520px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.chip{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--celeste);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;overflow-wrap:anywhere}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:40%;background:var(--celeste);animation:pg 1.1s ease-in-out infinite alternate}
@keyframes pg{from{margin-left:0}to{margin-left:60%}}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
#vbox:fullscreen{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:0;background:var(--bg)}
#vbox:-webkit-full-screen{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:0;background:var(--bg)}
#vbox:fullscreen h2,#vbox:-webkit-full-screen h2{display:none}
#vbox:fullscreen .stage,#vbox:-webkit-full-screen .stage{flex:1;aspect-ratio:auto;min-height:0}
.sb{position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(8,16,28,.88);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:6px 16px;font-family:var(--display);font-weight:700;font-size:22px;white-space:nowrap;max-width:94%;z-index:2}
.sb i{width:16px;height:16px;border-radius:3px;display:inline-block;flex:none;border:1px solid rgba(255,255,255,.55)}
.sb em{font-style:normal;color:var(--muted)}
.sb .tn{font-size:14px;font-weight:600;color:var(--muted);max-width:110px;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.04em}
.sb time{margin-left:10px;color:var(--ink);font-variant-numeric:tabular-nums}
.vbar{display:flex;align-items:center;gap:8px;background:#0a121d;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.vbar button{padding:6px 10px;min-width:36px}
.spd{display:flex;align-items:center;gap:4px}.spd b{min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.vbar .vt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:78px;text-align:center}
.pbar{position:relative;flex:1;min-width:80px;height:26px}
.pbar input{position:absolute;inset:0;width:100%;height:100%;margin:0;background:none;accent-color:var(--celeste)}
.marks{position:absolute;left:0;right:0;top:0;height:100%;pointer-events:none}
.vbar .gm{position:absolute;top:3px;width:6px;height:20px;padding:0;min-width:0;transform:translateX(-50%);border:1px solid #fff;border-radius:2px;pointer-events:auto;cursor:pointer}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.golgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);gap:16px;align-items:start}
.hlbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px;font-weight:600}
.gi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-weight:400;color:var(--ink);background:var(--row);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
div.gi{cursor:default}
button.gi:hover{border-color:var(--tc)}
.gi .bar{align-self:stretch;width:4px;border-radius:2px;background:var(--tc);flex:none}
.gi .gm{flex:1;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.gi .gm b{font-weight:600}
.gi .gm small{color:var(--muted);font-size:12px}
.gi .sc{font-family:var(--display);font-weight:700;font-size:20px;white-space:nowrap}
.gi .pt{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.gi.r{flex-direction:row-reverse;text-align:right}
.gi.r .gm{align-items:flex-end}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.shead .legend{margin:0}
canvas#sc{cursor:pointer}
.sdet{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--row)}
.sd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sd .mut{color:var(--muted)}
.sd .ver{margin-left:auto;padding:4px 10px}
.kcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card);display:flex;flex-direction:column;gap:2px}
.kcard span{font-size:13px;color:var(--muted)}
.kcard b{font-family:var(--display);font-size:30px;line-height:1.1}
.kcard small{color:var(--muted);font-size:12px}
.ptabs{margin-bottom:-4px}
.ptabs .ps{font-variant-numeric:tabular-nums;opacity:.8;margin-left:4px}
.zms{display:flex;gap:2px}
.zms button{padding:6px 8px;min-width:30px}
.zms button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vbar{flex-wrap:wrap}
.sb{gap:10px}
@media (max-width:640px){.golgrid{grid-template-columns:1fr}}

.vch{position:absolute;left:10px;bottom:10px;max-width:62%;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.3;pointer-events:none;z-index:2}

#vbox.fs{padding:0;gap:0;position:relative;background:#000;border:0}
#vbox.fs .stage{border:0;border-radius:0}
#vbox.fs .vbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(940px,94%);margin:0;background:rgba(8,12,20,.86);border-radius:14px;z-index:5;transition:opacity .25s}
#vbox.fs .note{display:none}
#vbox.fs .vch{left:16px;bottom:84px;font-size:15px}
#vbox.fs.idle .vbar{opacity:0;pointer-events:none}
#vbox.fs.idle,#vbox.fs.idle *{cursor:none}
#vbox.fs.idle .vch,#vbox.fs.hb .vch{bottom:16px}
#vbox.hb .vbar{display:none}

<body>
<div class="flagbar" role="presentation"></div>
<div class="wrap">
  <div class="brand">
    <img alt="Logo de la LTF" src="logo.png">
    <div>

      <p>Temporada 1</p>
    </div>
  </div>
  <nav id="nav" aria-label="Secciones"></nav>
  <div id="view" class="stack"></div>
</div>

<script src="config.js"></script>
<script>
(function(){
"use strict";
var LEAGUE="LTF · Temporada 1";
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var initials=function(n){return (String(n).trim().split(/\s+/).slice(0,2).map(function(w){return w[0]||""}).join("")||"?").toUpperCase()};
var fmt=function(t){var s=Math.max(0,Math.floor(t));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
var fmtMs=function(t){var ms=Math.max(0,Math.round(t*1000)),m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+String(ms%1000).padStart(3,"0")};
function rgba(hex,a){var h=String(hex).replace("#","");if(h.length!==6)return "rgba(120,140,130,"+a+")";return "rgba("+parseInt(h.slice(0,2),16)+","+parseInt(h.slice(2,4),16)+","+parseInt(h.slice(4,6),16)+","+a+")"}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"#888"}

/* =====================================================================
   Estado
   ===================================================================== */
var TABS=[["inicio","Inicio"],["subir","Subir partido"],["partidos","Replays"],["tabla","Tabla"],["goleadores","Goleadores"],["equipos","Equipos"]];
var SUBS=[["rep","Ver partido"],["par","Estadísticas"],["res","Alineaciones"],["jug","Jugadores"],["gol","Goles"],["pas","Pases"],["adv","Avanzado"],["cal","Mapas de calor"],["chat","Chat"],["eve","Cronología"],["per","Perfiles"]];
function blankUp(){return {title:"",round:"",t1:"",t2:"",status:"",bad:false,busy:false,M:null,buf:null}}
var S={teams:[],matches:[],role:"",code:"",canWrite:false,isAdmin:false,loaded:false,err:"",tab:"inicio",part:0,ssel:-1,
  cur:null,curMsg:"",mtab:"rep",sort:{k:"r",d:-1},pf:0,pr:0,sf:0,heat:"t1",up:blankUp(),E:{id:"",name:"",color:"#2f66c9",logo:""},
  armed:"",banner:"",sig:"",busyTeam:false};
var CM=null; // partido que se está dibujando ahora (vista previa o guardado)

/* =====================================================================
   Datos derivados (equipos, tabla, goleadores)
   ===================================================================== */
function teamById(id){for(var i=0;i<S.teams.length;i++)if(S.teams[i].id===id)return S.teams[i];return null}
function sideTeam(m,side){
  var t=teamById(side===1?m.t1:m.t2);if(t)return t;
  return {id:"",name:(side===1?m.n1:m.n2)||(side===1?"Rojo":"Azul"),color:side===1?"#d8483b":"#3f7be0",logo:""};
}
function standings(){
  var T={};S.teams.forEach(function(t){T[t.id]={t:t,pj:0,g:0,e:0,p:0,gf:0,gc:0}});
  S.matches.forEach(function(m){
    var A=T[m.t1],B=T[m.t2];if(!A||!B)return;
    A.pj++;B.pj++;A.gf+=m.s1;A.gc+=m.s2;B.gf+=m.s2;B.gc+=m.s1;
    if(m.s1>m.s2){A.g++;B.p++}else if(m.s1<m.s2){B.g++;A.p++}else{A.e++;B.e++}
  });
  var r=Object.keys(T).map(function(k){var x=T[k];x.pts=x.g*3+x.e;x.dg=x.gf-x.gc;x.pct=x.pj?Math.round(x.pts/(x.pj*3)*100):0;return x});
  r.sort(function(a,b){return b.pts-a.pts||b.dg-a.dg||b.gf-a.gf||a.t.name.localeCompare(b.t.name)});
  return r;
}
function scorerName(l){var m=String(l).match(/^(.*?)\s+\d+:\d{2}$/);return (m?m[1]:String(l)).trim()}
function scorers(){
  var M={};
  S.matches.forEach(function(m){
    [[m.g1,m.t1,m.n1],[m.g2,m.t2,m.n2]].forEach(function(p){
      (p[0]||[]).forEach(function(l){
        if(/\(AG\)/i.test(l))return;
        var n=scorerName(l);if(!n)return;var k=n.toLowerCase();
        if(!M[k])M[k]={name:n,n:0,tid:p[1],tn:p[2]};
        M[k].n++;M[k].tid=p[1];M[k].tn=p[2];
      });
    });
  });
  return Object.keys(M).map(function(k){return M[k]}).sort(function(a,b){return b.n-a.n||a.name.localeCompare(b.name)});
}

/* =====================================================================
   Piezas visuales
   ===================================================================== */
function mini(t){return t.logo?'<img class="mini" alt="" src="'+esc(t.logo)+'">':'<span class="mini" style="background:'+esc(t.color)+'">'+esc(initials(t.name))+'</span>'}
function bigLogo(t){return t.logo?'<img class="logo" alt="Escudo de '+esc(t.name)+'" src="'+esc(t.logo)+'">':'<div class="logo" style="background:'+esc(t.color)+'">'+esc(initials(t.name))+'</div>'}
function empty(t,s){return '<div class="panel empty"><strong>'+esc(t)+'</strong>'+esc(s)+'</div>'}
function rc(r){return r==null?"r-na":r>=7.5?"r-top":r>=7?"r-hi":r>=6.5?"r-mid":r>=6?"r-lo":r>=5.5?"r-low":"r-bad"}
function pill(r){return '<span class="pill '+rc(r)+'">'+(r==null?"–":r.toFixed(1))+'</span>'}
function dateStr(v){var d=new Date(v);return isNaN(d)?"":d.toLocaleDateString("es-AR",{day:"numeric",month:"short",year:"numeric"})}
function shareUrl(id){return location.origin+location.pathname+"#partido-"+id}

/* =====================================================================
   Análisis del replay (corre en el navegador)
   ===================================================================== */
function pos(d){if(!d)return null;var p=d.pos||d.a||d;var x=p.x,y=p.y;return (typeof x==="number"&&typeof y==="number")?[x,y]:null}
function teamOf(p){var t=p&&p.team;return t&&typeof t==="object"?t.id:t}
function playersOf(st){var a=st.players,o=[];if(Array.isArray(a))return a;if(a&&typeof a.forEach==="function")a.forEach(function(p){o.push(p)});return o}
function hexc(c,def){
  if(c==null)return def;
  if(typeof c==="string"){if(/^transparent$/i.test(c))return null;var h=c.replace(/^#|^0x/i,"");return /^[0-9a-f]{6}$/i.test(h)?"#"+h:def}
  if(typeof c==="number")return "#"+("000000"+c.toString(16)).slice(-6);
  if(Array.isArray(c)&&c.length>=3)return "rgb("+c[0]+","+c[1]+","+c[2]+")";
  return def;
}
function extractMap(A,reader){
  try{
    var st=reader.state,stad=st&&(st.stadium||(st.gameState&&st.gameState.stadium));
    if(!stad)return null;
    var ex=(A.Utils&&A.Utils.exportStadium)||A.exportStadium||(reader.exportStadium&&reader.exportStadium.bind(reader));
    var o=null;
    if(typeof ex==="function"){var txt=ex(stad);o=typeof txt==="string"?((window.JSON5&&window.JSON5.parse)?window.JSON5.parse(txt):JSON.parse(txt)):txt}
    if(!o&&typeof stad.toJSON==="function")o=stad.toJSON();
    if(!o||!o.vertexes)return null;
    var tr=o.traits||{};
    var tv=function(x,k){return x&&x[k]!==undefined?x[k]:(x&&x.trait&&tr[x.trait]?tr[x.trait][k]:undefined)};
    var vs=o.vertexes.map(function(v){return [+v.x||0,+v.y||0]});
    var segs=(o.segments||[]).map(function(g){
      if(tv(g,"vis")===false)return null;
      var col=hexc(tv(g,"color"),"#e8efe9");if(!col)return null;
      var a=vs[g.v0],b=vs[g.v1];if(!a||!b)return null;
      return {a:a,b:b,c:+tv(g,"curve")||0,col:col};
    }).filter(Boolean);
    var goals=(o.goals||[]).filter(function(g){return g.p0&&g.p1}).map(function(g){return {p0:g.p0,p1:g.p1,t:g.team==="blue"?2:1}});
    var discs=(o.discs||[]).map(function(d){
      var col=hexc(tv(d,"color"),"#ffcc00"),r=tv(d,"radius");if(r===undefined)r=10;
      if(!col||!d.pos||!(+r>0))return null;
      return {x:+d.pos[0]||0,y:+d.pos[1]||0,r:+r,col:col};
    }).filter(Boolean);
    var bg=o.bg||{},w=+bg.width||0,h=+bg.height||0,bx=w,by=h;
    vs.forEach(function(v){bx=Math.max(bx,Math.abs(v[0]));by=Math.max(by,Math.abs(v[1]))});
    if(!bx||!by)return null;
    var bp=o.ballPhysics,pp=o.playerPhysics;
    var btype=bg.type||"grass",field=btype==="hockey"?"#5d636b":(hexc(bg.color,"#718c5a")||"#718c5a");
    return {w:w,h:h,bx:bx+30,by:by+30,kor:+bg.kickOffRadius||0,type:btype,grass:field,
      segs:segs,goals:goals,discs:discs,br:(bp&&+bp.radius)||10,pr:(pp&&+pp.radius)||15};
  }catch(e){return null}
}

/* Convierte lo que se vio durante la lectura en el resumen del partido. Es una función pura. */
function buildAnalysis(R){
  var frames=R.frames,map=R.map,dur=frames.length?frames[frames.length-1].t:R.ticks/60,bx=0,by=0,GW=40,GH=20;
  if(map){bx=map.bx;by=map.by}
  else{frames.forEach(function(f){bx=Math.max(bx,Math.abs(f.b[0]));by=Math.max(by,Math.abs(f.b[1]))});bx=Math.round(bx*1.04)||400;by=Math.round(by*1.04)||200}
  var s1=0,s2=0;R.goals.forEach(function(g){if(g.tm===1)s1++;else s2++});
  var orient=R.votes>=0?1:-1;
  var plist=Object.keys(R.P).map(function(k){
    var o=R.P[k],mins=(o.s1+o.s2)*3/3600,h=[],i;
    for(i=0;i<GW*GH;i++)h.push(0);
    o.pts.forEach(function(q){
      var gx=clamp(Math.floor((q[0]+bx)/(2*bx)*GW),0,GW-1),gy=clamp(Math.floor((q[1]+by)/(2*by)*GH),0,GH-1);
      h[gy*GW+gx]++;
    });
    var pc=o.pp+o.pl;
    return {id:o.id,n:o.n,tm:o.s1>=o.s2?1:2,min:Math.round(mins*10)/10,touches:o.touches,passes:pc,pok:o.pp,
      pct:pc?Math.round(o.pp/pc*100):null,goals:o.goals,ast:o.ast,og:o.og,av:(R.AV&&R.AV[o.id])||"",r:null,heat:h};
  }).filter(function(p){return p.min>=0.2||p.touches>0||p.goals>0||p.ast>0||p.og>0});
  var avg={1:0,2:0},cnt={1:0,2:0};
  plist.forEach(function(p){if(p.min>=1){avg[p.tm]+=p.touches/p.min;cnt[p.tm]++}});
  [1,2].forEach(function(t){avg[t]=cnt[t]?avg[t]/cnt[t]:0});
  plist.forEach(function(p){
    if(p.min<1&&!p.goals&&!p.ast){p.r=null;return}
    var res=p.tm===1?s1-s2:s2-s1,r=6+p.goals*1+p.ast*0.7-p.og*1;
    if(p.passes>=8)r+=clamp((p.pok/p.passes-0.6)*3,-1,1);
    if(avg[p.tm]>0&&p.min>=1)r+=clamp((p.touches/p.min-avg[p.tm])/avg[p.tm]*0.5,-0.5,0.5);
    r+=res>0?0.4:(res<0?-0.3:0);
    p.r=Math.round(clamp(r,3,10)*10)/10;
  });
  var maxMin=0;plist.forEach(function(p){maxMin=Math.max(maxMin,p.min)});
  var mvp=null;
  plist.forEach(function(p){
    if(p.r==null||p.min<maxMin*0.25)return;
    if(!mvp||p.r>mvp.r||(p.r===mvp.r&&p.goals+p.ast>mvp.goals+mvp.ast))mvp=p;
  });
  var step=5,n=Math.max(1,Math.ceil(dur/step)),sum=[],c=[],i;
  for(i=0;i<n;i++){sum.push(0);c.push(0)}
  frames.forEach(function(f){var j=Math.min(n-1,Math.floor(f.t/step));sum[j]+=clamp(f.b[0]/bx,-1,1)*orient;c[j]++});
  var raw=sum.map(function(v,j){return c[j]?v/c[j]:0});
  var mom=raw.map(function(v,j){var a=raw[j-1],b=raw[j+1],t=v,k=1;if(a!==undefined){t+=a;k++}if(b!==undefined){t+=b;k++}return Math.round(t/k*100)/100});
  var pt=R.poss[1]+R.poss[2],p1=pt?Math.round(R.poss[1]/pt*100):50;
  var adv=advanced(R,plist,orient,bx,by,dur);
  return {v:2,dur:dur,b:[bx,by],map:map,poss:[p1,100-p1],orient:orient,s1:s1,s2:s2,goals:R.goals,players:plist,
    mvp:mvp?{id:mvp.id,n:mvp.n,r:mvp.r,tm:mvp.tm}:null,mom:mom,step:step,kit:R.KIT||{},chat:R.chat,gw:GW,gh:GH,adv:adv};
}

/* Estadísticas avanzadas: remates, xG (aproximado), xA, pases clave, +/-, posición, perfiles y eventos. */
function goalGeom(map,bx,by,dir){
  var gx=dir*(map&&map.w?map.w:bx*0.95),cy=0,half=by*0.25;
  if(map&&map.goals)map.goals.forEach(function(g){if(g.p0[0]*dir>0){gx=g.p0[0];cy=(g.p0[1]+g.p1[1])/2;half=Math.abs(g.p0[1]-g.p1[1])/2||half}});
  return {x:gx,y:cy,h:half};
}
function xgOf(px,py,G){
  var dx=Math.max(1,Math.abs(G.x-px)),a1=Math.atan2(G.y-G.h-py,dx),a2=Math.atan2(G.y+G.h-py,dx),ang=Math.abs(a2-a1);
  return clamp(Math.pow(ang/Math.PI,1.4)*1.3,0.02,0.95);
}
function fIdx(fr,t){var lo=0,hi=fr.length-1;while(lo<hi){var m=(lo+hi+1)>>1;if(fr[m].t<=t)lo=m;else hi=m-1}return lo}
function r2(v){return Math.round(v*100)/100}
function advanced(R,plist,orient,bx,by,dur){
  var kk=R.kicks||[],fr=R.frames||[],map=R.map,byId={},shots=[],gk={},i,j,J=R.J||{},MS=R.MS||{},adm=R.adm||{};
  plist.forEach(function(p){byId[p.id]=p;p.sh=0;p.sot=0;p.xg=0;p.xa=0;p.kp=0;p.pm=0;p.role=null});
  R.goals.forEach(function(g){
    if(g.og||g.id==null)return;
    for(i=kk.length-1;i>=0;i--)if(kk[i].id===g.id&&kk[i].t<=g.t){gk[i]=g;break}
  });
  kk.forEach(function(k,i){
    var dir=k.tm===1?orient:-orient,G=goalGeom(map,bx,by,dir),isG=!!gk[i],ok=isG,on=isG;
    if(!isG&&k.x*dir<bx*0.3)return;
    if(!isG&&fr.length>10){
      var f2=fr[fIdx(fr,k.t+0.5)],dxm=(f2.b[0]-k.x)*dir;
      if(dxm>40){
        var yAt=k.y+(f2.b[1]-k.y)*(G.x-k.x)/(f2.b[0]-k.x),miss=Math.abs(yAt-G.y);
        if(miss<=G.h*2.2){ok=true;on=miss<=G.h*1.1}
      }
    }
    if(!ok)return;
    var last=shots[shots.length-1];
    if(!isG&&last&&last.id===k.id&&k.t-last.t<1.2)return;
    /* punto final de la trayectoria: dónde cruza la línea del arco */
    var ex=G.x,ey=G.y;
    if(fr.length>10){
      var f3=fr[fIdx(fr,k.t+0.5)],dx3=(f3.b[0]-k.x)*dir;
      if(dx3>40){var ya=k.y+(f3.b[1]-k.y)*(G.x-k.x)/(f3.b[0]-k.x);ey=isG?clamp(ya,G.y-G.h*0.9,G.y+G.h*0.9):clamp(ya,-by,by)}
    }
    var xgv=r2(Math.max(xgOf(k.x,k.y,G),isG?0.03:0)),sv=null,xgot=null;
    if(on){var off=Math.min(1,Math.abs(ey-G.y)/(G.h||1));xgot=r2(clamp(xgv*(1.4-0.8*off),0.02,0.97))}
    if(on&&!isG){for(var q=i+1;q<kk.length&&kk[q].t-k.t<=3;q++){if(kk[q].tm!==k.tm){sv=kk[q].id;break}}}
    shots.push({i:i,t:k.t,id:k.id,tm:k.tm,xg:xgv,xgot:xgot,sv:sv,on:on,g:isG,f:k.f==null?null:k.f,x:Math.round(k.x),y:Math.round(k.y),ex:Math.round(ex),ey:Math.round(ey)});
  });
  shots.forEach(function(s){
    var p=byId[s.id];if(p){p.sh++;if(s.on)p.sot++;p.xg+=s.xg}
    for(j=s.i-1;j>=0&&j>=s.i-4;j--){
      var k=kk[j];if(k.tm!==s.tm)break;
      if(k.id!==s.id){if(s.t-k.t<=6&&byId[k.id]){byId[k.id].kp++;byId[k.id].xa+=s.xg}break}
    }
    if(s.g&&gk[s.i]){var gg=gk[s.i];gg.xg=s.xg;var c=1;for(var q2=s.i-1;q2>=0;q2--){if(kk[q2].tm!==s.tm)break;if(kk[q2+1].t-kk[q2].t>6)break;c++}gg.ch=c}
    delete s.i;
  });
  R.goals.forEach(function(g){
    if(!fr.length)return;
    fr[fIdx(fr,Math.max(0,g.t-1))].p.forEach(function(q){if(byId[q[0]])byId[q[0]].pm+=(q[3]===g.tm?1:-1)});
  });
  [1,2].forEach(function(tm){
    var dir=tm===1?orient:-orient,list=[];
    plist.forEach(function(p){
      if(p.tm!==tm||p.min<1||!R.P[p.id])return;
      var pts=R.P[p.id].pts,sx=0;pts.forEach(function(q){sx+=q[0]*dir/bx});
      p.mx=pts.length?sx/pts.length:0;list.push(p);
    });
    list.sort(function(a,b){return a.mx-b.mx});
    list.forEach(function(p,ix){p.role=(ix===0&&p.mx<-0.35)?"GK":p.mx<-0.12?"DEF":p.mx>0.12?"FWD":"MID";delete p.mx});
  });
  plist.forEach(function(p){
    var j=J[p.id]||{},o=R.P[p.id]||{};
    p.xg=r2(p.xg);p.xa=r2(p.xa);
    p.fl=o.fl||j.fl||"";p.jin=j.in==null?0:j.in;p.jout=j.out==null?null:j.out;p.msgs=MS[p.id]||0;p.adm=!!(j.adm||adm[p.id]);
  });
  var tl=0,tn=0;fr.forEach(function(f){var v=f.b[0]*orient;if(v>0)tl++;if(v!==0)tn++});
  var t1=tn?Math.round(tl/tn*100):50;
  var spec=[];Object.keys(J).forEach(function(k){var j=J[k];if(!byId[j.id]&&!R.P[j.id])spec.push({id:j.id,n:j.n,fl:j.fl||"",jin:j.in,jout:j.out==null?null:j.out,msgs:MS[j.id]||0})});
  var ev=[];
  R.goals.forEach(function(g){ev.push({t:g.t,k:g.og?"ag":"gol",tm:g.tm,n:g.n,an:g.an||null})});
  shots.forEach(function(s){if(!s.g&&s.xg>=0.3){var p=byId[s.id];ev.push({t:s.t,k:"oc",tm:s.tm,n:p?p.n:"?",xg:s.xg})}});
  Object.keys(J).forEach(function(k){var j=J[k];if(j.in>1)ev.push({t:j.in,k:"in",n:j.n});if(j.out!=null&&j.out<dur-1)ev.push({t:j.out,k:"out",n:j.n})});
  ev.sort(function(a,b){return a.t-b.t});
  return {shots:shots,tilt:[t1,100-t1],ev:ev,spec:spec};
}

var API=null;
function loadScript(src){return new Promise(function(ok,no){var s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=function(){no(new Error("No se pudo cargar "+src))};document.head.appendChild(s)})}
function getAPI(){
  if(API)return Promise.resolve(API);
  return loadScript("https://cdnjs.cloudflare.com/ajax/libs/json5/2.2.3/index.min.js")
    .then(function(){return loadScript("https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js")})
    .then(function(){return loadScript("https://cdn.jsdelivr.net/npm/node-haxball@2.3.0/src/api.js")})
    .then(function(){API=window.abcHaxballAPI(window);return API});
}
function analyze(buf){
  return getAPI().then(function(A){return new Promise(function(ok,no){
    /* Cada acumulador tiene su propio reloj, que solo corre desde el saque hasta cada gol (como el cronómetro de HaxBall).
       ALL es el partido completo; cada vez que el juego arranca de nuevo se abre un "partido" aparte. */
    function newAcc(){return {clk:0,frames:[],P:{},kicks:[],goals:[],poss:[0,0,0],votes:0,lastKick:null,f0:0,iv:[]}}
    var ALL=newAcc(),segs=[],cur=null,running=false,seenK=false,map=null,mapTried=false,chat=[],reader,timer,J={},adm={},MS={},AV={},KIT={};
    function fno(){try{var f=reader.getCurrentFrameNo();return typeof f==="number"?f:null}catch(e){return null}}
    function each(fn){fn(ALL);if(cur)fn(cur)}
    /* intervalos de frames en que el reloj del partido corre (del saque hasta el gol); sirven para mostrar bien el reloj y el marcador al adelantar */
    function openIv(){var l=ALL.iv[ALL.iv.length-1];if(!l||l[1]!=null){var fn=fno();if(fn!=null)ALL.iv.push([fn,null])}}
    function closeIv(f){var l=ALL.iv[ALL.iv.length-1];if(l&&l[1]==null&&f!=null)l[1]=f}
    function openSeg(){cur=newAcc();cur.f0=fno()||0;segs.push(cur)}
    function pl(a,id,name){var o=a.P[id];if(!o)o=a.P[id]={id:id,n:name||"?",s1:0,s2:0,touches:0,pp:0,pl:0,goals:0,ast:0,og:0,pts:[],fl:""};if(name)o.n=name;return o}
    function ballNow(){
      try{var ph=reader.state.gameState.physicsState;return pos(ph.discs[0])}catch(e){return ALL.frames.length?ALL.frames[ALL.frames.length-1].b:null}
    }
    function sample(){
      var st=reader.state,gs=st.gameState,ph=gs&&gs.physicsState;if(!ph||!ph.discs)return;
      if(!mapTried){mapTried=true;map=extractMap(A,reader)}
      var bp=pos(ph.discs[0]);if(!bp)return;
      try{[1,2].forEach(function(t){
        if(KIT[t])return;var tcs=(gs&&gs.teamColors)||st.teamColors,c=tcs&&tcs[t];if(!c)return;
        var hx=function(v){return typeof v==="number"?"#"+("000000"+(v&16777215).toString(16)).slice(-6):null};
        var ins=(c.inner||c.colors||[]).map(hx).filter(Boolean);if(!ins.length)return;
        KIT[t]={a:+c.angle||0,t:hx(c.text)||"#ffffff",c:ins};
      })}catch(e){}
      var L=[];
      playersOf(st).forEach(function(p){
        var tm=teamOf(p);if(tm!==1&&tm!==2)return;
        if(p.avatar!=null&&p.avatar!=="")AV[p.id]=String(p.avatar);
        var dd=typeof p.disc==="number"?ph.discs[p.disc]:p.disc,dp=pos(dd);if(!dp)return;
        L.push({p:p,tm:tm,dp:dp});
      });
      each(function(a){
        var f={t:a.clk/60,b:bp,p:[]};
        L.forEach(function(x){
          var o=pl(a,x.p.id,x.p.name);if(x.tm===1)o.s1++;else o.s2++;
          if(x.p.flag&&!o.fl)o.fl=String(x.p.flag).toLowerCase();
          o.pts.push(x.dp);f.p.push([x.p.id,x.dp[0],x.dp[1],x.tm]);
        });
        a.frames.push(f);
      });
    }
    function mkR(a,partial){return {frames:a.frames,P:a.P,goals:a.goals,chat:partial?[]:chat,AV:AV,KIT:KIT,poss:a.poss,map:map,votes:a.votes,ticks:a.clk,kicks:a.kicks,J:partial?{}:J,adm:partial?{}:adm,MS:partial?{}:MS}}
    function finish(partial){
      clearTimeout(timer);try{reader.destroy()}catch(e){}
      try{
        closeIv(fno());var an=buildAnalysis(mkR(ALL,false));an.iv=ALL.iv.filter(function(v){return v[1]!=null});var good=segs.filter(function(g){return g.clk>=300});
        if(good.length>=2){
          an.parts=good.map(function(g){
            var pa=buildAnalysis(mkR(g,true));
            pa.map=null;pa.chat=null;pa.f0=g.f0;
            pa.players.forEach(function(q){
              var w=an.players.filter(function(z){return z.id===q.id})[0];
              if(w){q.msgs=w.msgs;q.adm=w.adm;if(!q.fl)q.fl=w.fl}
            });
            return pa;
          });
        }
        ok({A:an,frames:ALL.frames.length>=30?ALL.frames:null,partial:partial});
      }catch(e){no(e)}
    }
    timer=setTimeout(function(){finish(true)},60000);
    try{
      reader=A.Replay.read(new Uint8Array(buf),{
        onGameStart:function(){running=false;closeIv(fno());ALL.lastKick=null;openSeg()},
        onKickOff:function(){seenK=true;running=true;openIv();each(function(a){a.lastKick=null})},
        onGameTick:function(){
          if(!running)return;
          if(!cur)openSeg();
          each(function(a){a.clk++;if(a.lastKick)a.poss[a.lastKick.tm]++});
          if(ALL.clk%3===0){try{sample()}catch(e){}}
        },
        onPlayerBallKick:function(id){
          var p=reader.state.getPlayer(id),tm=teamOf(p);
          if(!p||(tm!==1&&tm!==2))return;
          if(!seenK){seenK=true;running=true;openIv();if(!cur)openSeg()}
          var bp0=ballNow(),fn=fno();
          each(function(a){
            var o=pl(a,id,p.name);o.touches++;var t=a.clk/60,lk=a.lastKick;
            if(lk&&lk.id!==id){var pv=a.P[lk.id];if(pv){if(lk.tm===tm)pv.pp++;else pv.pl++}}
            var k={id:id,tm:tm,t:t,x:bp0?bp0[0]:0,y:bp0?bp0[1]:0,f:fn};a.kicks.push(k);a.lastKick=k;
          });
        },
        onTeamGoal:function(teamId){
          var gf=fno(),b=ballNow();
          each(function(a){
            var t=a.clk/60,sc=a.kicks.length?a.kicks[a.kicks.length-1]:null,og=false,ast=null;
            if(b&&b[0]!==0)a.votes+=(teamId===1?1:-1)*(b[0]>0?1:-1);
            if(sc&&sc.t>=t-30){
              og=sc.tm!==teamId;var so=a.P[sc.id];
              if(so){if(og)so.og++;else so.goals++}
              if(!og){
                for(var j=a.kicks.length-2;j>=0&&j>=a.kicks.length-6;j--){
                  var k=a.kicks[j];if(k.tm!==teamId)break;
                  if(k.id!==sc.id){if(sc.t-k.t<=8&&a.P[k.id]){ast=k;a.P[k.id].ast++}break}
                }
              }
            }else sc=null;
            a.goals.push({t:t,tm:teamId,id:sc?sc.id:null,n:sc&&a.P[sc.id]?a.P[sc.id].n:"Gol",og:og,aid:ast?ast.id:null,an:ast&&a.P[ast.id]?a.P[ast.id].n:null,f:gf});
            a.lastKick=null;
          });
          running=false;closeIv(gf);
        },
        onPlayerChat:function(id,message){
          MS[id]=(MS[id]||0)+1;
          if(chat.length>=400)return;
          var p=null;try{p=reader.state.getPlayer(id)}catch(e){}
          chat.push({t:ALL.clk/60,f:fno(),n:p?p.name:"?",m:String(message).slice(0,200),i:id});
        },
        onPlayerJoin:function(p){
          if(!p||typeof p!=="object"||p.id==null)return;
          J[p.id]={id:p.id,n:p.name||"?",fl:p.flag?String(p.flag).toLowerCase():"",in:ALL.clk/60,out:null,adm:!!p.admin};
        },
        onPlayerLeave:function(p){
          if(!p||typeof p!=="object"||p.id==null)return;
          if(J[p.id])J[p.id].out=ALL.clk/60;
        },
        onPlayerAdminChange:function(id,isAdmin){
          if(typeof id==="number"&&isAdmin)adm[id]=true;
        }
      });
      reader.onEnd=function(){finish(false)};
      reader.setSpeed(200);
    }catch(err){clearTimeout(timer);no(err)}
  })});
}

function momentumHTML(M){

  A.players.forEach(function(p){var x=T[p.tm];x.touch+=p.touches;x.pass+=p.passes;x.pok+=p.pok;x.kp+=p.kp||0;x.sh+=p.sh||0;x.sot+=p.sot||0;x.xg+=p.xg||0});
  return T;
}
function cmpRow(M,label,a,b,f){
  var t=(a+b)||1,pa=Math.round(a/t*100);
  return '<div class="cmp"><b>'+f(a)+'</b><div class="bar"><span style="width:'+pa+'%;background:'+esc(sideTeam(M,1).color)+'"></span><span style="width:'+(100-pa)+'%;background:'+esc(sideTeam(M,2).color)+'"></span></div><b>'+f(b)+'</b><em>'+esc(label)+'</em></div>';
}

  var pp1=T[1].pass?T[1].pok/T[1].pass*100:0,pp2=T[2].pass?T[2].pok/T[2].pass*100:0;
  return '<div class="panel"><h2>Estadísticas</h2>'+

    cmpRow(M,"Pases",T[1].pass,T[2].pass,i)+
    cmpRow(M,"% de pase",pp1,pp2,pc)+

function shotEnd(sh,A){
  var ex=sh.ex,ey=sh.ey;
  if(ex==null){
    var dir=sh.tm===1?A.orient:-A.orient;ex=dir*(A.map&&A.map.w?A.map.w:A.b[0]*.95);ey=0;
    if(A.map&&A.map.goals)A.map.goals.forEach(function(gl){if(gl.p0[0]*dir>0){ex=gl.p0[0];ey=(gl.p0[1]+gl.p1[1])/2}});
  }
  return [ex,ey];
}
function drawShots(){
  var c=$("sc");if(!c||!CM||!CM.A||!CM.A.adv)return;
  var A=CM.A,g=c.getContext("2d"),W=c.width,H=c.height,b=A.b,s=W/(2*b[0]),k=W/960,sel=S.ssel;
  var X=function(q){return (q+b[0])*s},Y=function(q){return (q+b[1])*s};
  g.clearRect(0,0,W,H);g.fillStyle=css("--row");g.fillRect(0,0,W,H);
  if(A.map){drawMap(g,A.map,X,Y,s,false)}
  else{g.strokeStyle=css("--line");g.lineWidth=2;g.strokeRect(1,1,W-2,H-2);g.beginPath();g.moveTo(W/2,0);g.lineTo(W/2,H);g.stroke()}
  var shots=A.adv.shots,vis=function(sh){return !S.sf||sh.tm===S.sf};
  /* líneas suaves para todos; solo el remate elegido se marca fuerte */
  shots.forEach(function(sh,ix){
    if(!vis(sh)||ix===sel)return;
    var e=shotEnd(sh,A);
    g.beginPath();g.moveTo(X(sh.x),Y(sh.y));g.lineTo(X(e[0]),Y(e[1]));
    g.globalAlpha=sel>=0?.1:.22;g.strokeStyle=sideTeam(CM,sh.tm).color;g.lineWidth=Math.max(1.5,2*k);g.stroke();g.globalAlpha=1;
  });
  if(sel>=0&&shots[sel]&&vis(shots[sel])){
    var ss=shots[sel],e2=shotEnd(ss,A),sc=sideTeam(CM,ss.tm).color;
    g.save();g.lineCap="round";g.setLineDash(ss.g||ss.on?[]:[10*k,8*k]);
    g.beginPath();g.moveTo(X(ss.x),Y(ss.y));g.lineTo(X(e2[0]),Y(e2[1]));
    g.strokeStyle="rgba(255,255,255,.9)";g.lineWidth=Math.max(3,5*k);g.stroke();
    g.strokeStyle=sc;g.lineWidth=Math.max(2,3*k);g.stroke();g.restore();
    g.beginPath();g.arc(X(e2[0]),Y(e2[1]),Math.max(3,4*k),0,6.2832);g.fillStyle=sc;g.fill();g.lineWidth=1.5;g.strokeStyle="#fff";g.stroke();
  }
  shots.forEach(function(sh,ix){
    if(!vis(sh))return;
    var col=sideTeam(CM,sh.tm).color,r=Math.max(6,(6+sh.xg*22)*k),dim=sel>=0&&ix!==sel;
    g.globalAlpha=dim?.45:1;
    g.beginPath();g.arc(X(sh.x),Y(sh.y),r,0,6.2832);
    if(sh.g){g.fillStyle="#ffffff";g.fill();g.lineWidth=4*k;g.strokeStyle=col;g.stroke()}
    else if(sh.on){g.fillStyle=col;g.globalAlpha=dim?.35:.85;g.fill();g.globalAlpha=dim?.45:1;g.lineWidth=2*k;g.strokeStyle="#ffffff";g.stroke()}
    else{g.lineWidth=3*k;g.strokeStyle=col;g.stroke()}
    g.globalAlpha=1;
    if(ix===sel){g.beginPath();g.arc(X(sh.x),Y(sh.y),r+5*k,0,6.2832);g.lineWidth=2.5*k;g.strokeStyle="#ffffff";g.stroke()}
  });
}
function pickShot(e){
  var c=$("sc");if(!c||!CM||!CM.A||!CM.A.adv)return;
  var rc=c.getBoundingClientRect(),W=c.width,k=W/960,sc=W/rc.width,px=(e.clientX-rc.left)*sc,py=(e.clientY-rc.top)*sc,A=CM.A,b=A.b,s=W/(2*b[0]),best=-1,bd=1e9;
  A.adv.shots.forEach(function(sh,ix){
    if(S.sf&&sh.tm!==S.sf)return;
    var dx=(sh.x+b[0])*s-px,dy=(sh.y+b[1])*s-py,d=Math.sqrt(dx*dx+dy*dy),r=Math.max(6,(6+sh.xg*22)*k)+10*k;
    if(d<=r&&d<bd){bd=d;best=ix}
  });
  S.ssel=best===S.ssel?-1:best;
  var det=$("sdet");if(det)det.innerHTML=shotDetailHTML(CM);
  drawShots();
}

  analyze(up.buf).then(function(res){
    var A=res.A;if(!A.players.length&&!A.goals.length)throw new Error("no encontré jugadores ni goles en el archivo");
    up.M={id:"",title:up.title,round:up.round,t1:up.t1,t2:up.t2,n1:"",n2:"",s1:A.s1,s2:A.s2,g1:[],g2:[],A:A,frames:res.frames,saved:false,created_at:Date.now()};

}

  S.cur=M;S.curMsg="";V.t=0;V.playing=false;S.part=0;S.ssel=-1;S.sf=0;RP.pend=0;render();
  api.get("matches?id=eq."+encodeURIComponent(id)+"&select=stats").then(function(r){
    var st=r[0]&&r[0].stats;M.A=st&&typeof st==="object"?st:{v:1};
    if(S.cur===M){render();if(S.mtab==="rep")loadReplay(M)}
  }).catch(function(){M.A={v:1};if(S.cur===M)render()});
}
function loadReplay(M){
  if(M.rbuf||M.rstate||!M.has_replay||!M.A||M.A.v!==2)return;
  M.rstate="loading";render();
  api.get("matches?id=eq."+encodeURIComponent(M.id)+"&select=replay").then(function(r){
    var b=r[0]&&r[0].replay;if(!b)throw new Error("sin replay");
    return b64dec(b);
  }).then(function(buf){M.rbuf=buf;M.rstate="ok"})
  .catch(function(){M.rstate="err"}).then(function(){if(S.cur===M)render()});
}
function route(){
  var h=location.hash.slice(1),m=h.match(/^partido-([0-9a-f-]{36})$/i);
  V.playing=false;killPlayer();
  if(m){
    S.tab="partido";
    if(!S.cur||S.cur.id!==m[1]){S.cur=null;if(S.loaded){openMatch(m[1]);return}}
  }else{
    if(TABS.some(function(t){return t[0]===h}))S.tab=h;
    else if(S.tab==="partido")S.tab="inicio";
    S.cur=null;if(S.tab!=="subir")S.banner="";
  }
  render();
}
function render(){
  var tabs=TABS.filter(function(t){return t[0]!=="equipos"||S.isAdmin});
  var active=S.tab==="partido"?"partidos":S.tab;
  $("nav").innerHTML=tabs.map(function(t){return '<button type="button" data-tab="'+t[0]+'"'+(active===t[0]?' aria-current="page"':"")+'>'+t[1]+'</button>'}).join("")+
    '<button type="button" data-act="codebtn" style="margin-left:auto;flex:none">'+(S.role?"Salir":"Ingresar código")+'</button>';
  var v=$("view");
  if(S.err&&!S.loaded){v.innerHTML=empty("No se pudo abrir",S.err);return}
  if(!S.loaded){v.innerHTML=empty("Abriendo la liga…","Un momento.");return}
  CM=null;
  var f={inicio:vInicio,tabla:vTabla,partidos:vPartidos,goleadores:vGoleadores,subir:vSubir,equipos:vEquipos,partido:vPartido}[S.tab]||vInicio;
  v.innerHTML=f();
  if(S.tab==="partido"&&S.cur&&S.mtab==="rep"&&S.cur.A&&!S.cur.rbuf&&!S.cur.rstate)loadReplay(S.cur);
  wireDrop();wireViewer();drawHeat();drawShots();
}
function softRender(){var a=document.activeElement;if(a&&$("view").contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;render()}
function wireDrop(){
  var d=$("drop");if(!d)return;
  ["dragover","dragenter"].forEach(function(n){d.addEventListener(n,function(e){e.preventDefault();d.classList.add("over")})});
  ["dragleave","drop"].forEach(function(n){d.addEventListener(n,function(e){e.preventDefault();d.classList.remove("over")})});
  d.addEventListener("drop",function(e){pickFile(e.dataTransfer.files[0])});
}

/* =====================================================================
   Acciones
   ===================================================================== */
function fail(err){var m=(err&&err.message)||"error";S.busyTeam=false;alert_("No se pudo guardar ("+m+"). Revisá que tu código siga siendo válido.");render()}
function alert_(msg){S.up.status=msg;S.up.bad=true}
function setRole(r){S.role=r||"";S.canWrite=(r==="captain"||r==="admin");S.isAdmin=(r==="admin")}
function checkCode(c){return api.rpc("check_code",{code:c}).then(function(r){return r||""})}
function enterCode(){
  var el=$("code"),c=el?el.value.trim():"";if(!c)return;
  checkCode(c).then(function(r){
    if(!r){S.codeMsg="Ese código no es válido.";S.codeBad=true;render();return}
    S.code=c;setRole(r);S.codeMsg="";S.codeBad=false;try{localStorage.setItem("ltf-code",c)}catch(e){}render();
  }).catch(function(err){S.codeMsg="No se pudo verificar el código ("+((err&&err.message)||"error")+").";S.codeBad=true;render()});
}
function logout(){S.code="";setRole("");try{localStorage.removeItem("ltf-code")}catch(e){}if(S.tab==="equipos")location.hash="tabla";render()}
function shrink(file,cb){
  var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(1,160/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/png"))};im.src=rd.result};rd.readAsDataURL(file)}
function saveTeam(){
  var E=S.E,t={name:E.name.trim(),color:E.color,logo:E.logo||""};if(!t.name||S.busyTeam)return;
  S.busyTeam=true;render();
  api.rpc("save_team",{code:S.code,p_id:E.id||null,p_name:t.name,p_color:t.color,p_logo:t.logo}).then(function(){
    S.E={id:"",name:"",color:"#2f66c9",logo:""};S.busyTeam=false;return loadAll(true);
  }).catch(fail);
}
function copyLink(btn){
  var url=shareUrl(S.cur.id),done=function(){if(btn){btn.textContent="Link copiado";setTimeout(function(){btn.textContent=btn.dataset.act==="copylink"&&btn.classList.contains("primary")?"Copiar link":"Copiar"},1800)}};
  var fallback=function(){var i=$("lk");if(i){i.focus();i.select()}else window.prompt&&0;done()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(done,fallback);else fallback();
}

$("nav").addEventListener("click",function(e){
  var b=e.target.closest("[data-tab]");if(b){location.hash=b.dataset.tab;return}
  if(e.target.closest("[data-act=codebtn]")){if(S.role)logout();else location.hash="subir"}
});
$("view").addEventListener("click",function(e){
  if(e.target.id==="sc"){pickShot(e);return}
  var b=e.target.closest("[data-act],[data-mt],[data-pf],[data-pr],[data-sort],[data-sf],[data-part],[data-seek]");if(!b)return;
  var act=b.dataset.act,id=b.dataset.id;
  if(b.dataset.seek!==undefined){goToFrame(+b.dataset.seek);return}
  if(b.dataset.sf!==undefined){S.sf=+b.dataset.sf;S.ssel=-1;render();return}
  if(b.dataset.part!==undefined){setPart(+b.dataset.part);return}
  if(b.dataset.pr!==undefined){S.pr=+b.dataset.pr;render();return}
  if(b.dataset.mt){S.mtab=b.dataset.mt;if(S.mtab!=="rep"){V.playing=false;killPlayer()}render();return}
  if(b.dataset.pf!==undefined){S.pf=+b.dataset.pf;render();return}
  if(b.dataset.sort){var k=b.dataset.sort;S.sort=S.sort.k===k?{k:k,d:-S.sort.d}:{k:k,d:k==="n"?1:-1};render();return}
  if(act==="entercode")enterCode();
  if(act==="analyze")runAnalysis();
  if(act==="resetfile"){S.up=blankUp();render()}
  if(act==="saveteam")saveTeam();
  if(act==="cancelteam"){S.E={id:"",name:"",color:"#2f66c9",logo:""};render()}
  if(act==="editteam"){var t=teamById(id);if(t){S.E={id:t.id,name:t.name,color:t.color||"#2f66c9",logo:t.logo||""};render();window.scrollTo(0,0)}}
  if(act==="delteam"){if(S.armed!=="t"+id){S.armed="t"+id;render()}else{S.armed="";api.rpc("delete_team",{code:S.code,p_id:id}).then(function(){return loadAll(true)}).catch(fail)}}
  if(act==="delmatch"){if(S.armed!=="m"+id){S.armed="m"+id;render()}else{S.armed="";api.rpc("delete_match",{code:S.code,p_id:id}).then(function(){return loadAll(true)}).then(function(){location.hash="partidos"}).catch(fail)}}
  if(act==="copylink")copyLink(b);
});
$("view").addEventListener("input",function(e){
  var u=e.target.dataset.u,ek=e.target.dataset.e;
  if(u==="title"||u==="round"){
    S.up[u]=e.target.value;
    if(u==="title"&&S.up.M){S.up.M.title=e.target.value;var el=document.querySelector(".hero .mt");if(el)el.textContent=e.target.value}
  }
  if(ek){S.E[ek]=e.target.value;var bt=document.querySelector('[data-act="saveteam"]');if(bt&&ek==="name")bt.disabled=!S.E.name.trim()}
});
$("view").addEventListener("change",function(e){
  var t=e.target,u=t.dataset.u;
  if(t.id==="rf"&&t.files[0]){var rr=new FileReader();rr.onload=function(){if(S.cur){S.cur.rbuf=rr.result;S.cur.rstate="ok";render()}};rr.readAsArrayBuffer(t.files[0]);return}
  if(t.id==="file"){pickFile(t.files[0]);return}
  if(t.id==="el"&&t.files[0]){shrink(t.files[0],function(url){S.E.logo=url;render()});return}
  if(t.id==="hsel"){drawHeat();return}
  if(u==="t1"||u==="t2"){
    var up=S.up;up[u]=t.value;
    if(up.t1&&up.t2&&up.t1!==up.t2&&(!up.title||/\.hbr2?$|^HBReplay/i.test(up.title)||/ vs /.test(up.title)))
      up.title=teamById(up.t1).name+" vs "+teamById(up.t2).name+(up.round?" | Fecha "+up.round:"");
    render();
  }
});
$("view").addEventListener("keydown",function(e){if(e.target.id==="code"&&e.key==="Enter")enterCode()});
window.addEventListener("hashchange",route);
document.addEventListener("keydown",function(e){
  if(!$("vc")||e.ctrlKey||e.metaKey||e.altKey||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||""))return;
  if(e.key==="g"||e.key==="G")jumpGoal(1);
  else if(e.key==="h"||e.key==="H"){var vb=$("vbox");if(vb)vb.classList.toggle("hb")}
  else if(e.key==="m"||e.key==="M"){var mb=$("vmu");if(mb)mb.click()}
  else if(e.key===" "&&e.target===document.body){e.preventDefault();var pb=$("vp");if(pb)pb.click()}
  else if(/^[1-5]$/.test(e.key))setZoom(+e.key);
});
function fsIcon(){var bx=$("vbox"),on0=document.fullscreenElement||document.webkitFullscreenElement;if(bx){bx.classList.toggle("fs",!!on0);bx.classList.remove("idle")}var b=$("vf");if(!b)return;var on=document.fullscreenElement||document.webkitFullscreenElement;b.textContent=on?"✕":"⛶";b.title=on?"Salir de pantalla completa":"Pantalla completa"}
document.addEventListener("fullscreenchange",fsIcon);document.addEventListener("webkitfullscreenchange",fsIcon);

/* =====================================================================
   Arranque
   ===================================================================== */
render();
if(!CFG.url||!CFG.key||/PEGAR_AQUI/.test(CFG.url+CFG.key)){
  S.err="Falta configurar la conexión. Completá el archivo config.js con la dirección y la clave de tu proyecto de Supabase.";render();return;
}
loadAll(true);
setInterval(function(){loadAll(false)},60000);
var saved="";try{saved=localStorage.getItem("ltf-code")||""}catch(e){}
if(saved)checkCode(saved).then(function(r){if(r){S.code=saved;setRole(r);render()}else{try{localStorage.removeItem("ltf-code")}catch(e){}}}).catch(function(){});
})();
</script>
</body>
</html>
